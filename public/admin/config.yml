# ──────────────────────────────────────────────────────────────
# Decap CMS — Backend GitHub via proxy OAuth (solution temporaire)
#
# L'authentification passe par les fonctions Vercel /api/auth + /api/callback
# (le client_secret reste côté serveur). Variables d'env requises sur Vercel :
#   OAUTH_GITHUB_CLIENT_ID, OAUTH_GITHUB_CLIENT_SECRET
# OAuth App GitHub — Authorization callback URL :
#   https://ft2e-v3.vercel.app/api/callback
#
# ⚠ `repo` et `base_url` ont porté `ft2e-v2` jusqu'au 2026-08-10 — vestige du
# fork, corrigé ce jour. Le CMS aurait committé dans le dépôt de la v2 : à
# vérifier en premier sur toute reprise de ce fichier après un fork.
# ⚠ ACTION HORS DÉPÔT, ENCORE DUE : la callback de l'OAuth App GitHub doit
# être passée à l'URL ci-dessus, et OAUTH_GITHUB_CLIENT_ID / _SECRET reportés
# sur le projet Vercel `ft2e-v3`. Tant que ce n'est pas fait, la connexion au
# CMS échoue — le fichier est juste, l'infrastructure ne l'est pas encore.
# À refaire au passage en production (OVH/souverain). Voir docs/20.
# ──────────────────────────────────────────────────────────────
#
# ⚠ SYNCHRONISATION Zod ↔ Decap — la source de vérité est
# `src/content.config.ts`. Toute énumération ci-dessous (`options`,
# `view_filters`) doit recopier à l'identique le `z.enum()` correspondant :
# Decap n'a aucun moyen de valider une valeur hors liste, mais le build
# Astro, lui, refusera la fiche. Une divergence d'une seule chaîne suffit
# à rendre impossible toute création de fiche depuis le CMS.
# Voir `.claude/rules/content-collections.md` et `docs/03-modele-contenu.md`.
# ──────────────────────────────────────────────────────────────

backend:
  name: github
  repo: JeffCrn/ft2e-v3
  branch: master
  base_url: https://ft2e-v3.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images"
public_folder: "/images"

locale: fr

site_url: https://ft2e.fr
display_url: https://ft2e.fr
logo_url: /favicon.svg

collections:

  # ───────────────── PROJETS / RÉFÉRENCES ─────────────────
  - name: "projets"
    label: "Projets / Références"
    label_singular: "Projet"
    folder: "src/content/projets"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}} — {{lieu}} ({{annee}})"
    sortable_fields: [annee, titre, secteur]
    # Les sept secteurs recopient le tableau SECTEURS de src/content.config.ts.
    view_filters:
      - { label: "Mis en avant", field: en_avant, pattern: true }
      - { label: "Logements", field: secteur, pattern: "Logements" }
      - { label: "Tertiaire / ERP", field: secteur, pattern: "Tertiaire / ERP" }
      - { label: "Industriel", field: secteur, pattern: "Industriel" }
      - { label: "Patrimoine", field: secteur, pattern: "Patrimoine" }
      - { label: "Monotechnique — Audit", field: secteur, pattern: "Monotechnique — Audit" }
      - { label: "Coordination SSI", field: secteur, pattern: "Coordination SSI" }
      - { label: "Études d’exécution / BIM", field: secteur, pattern: "Études d’exécution / BIM" }
      - { label: "Affaires en cours", field: statut, pattern: "en cours" }
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true
        pattern: ['^.{2,80}$', '2 à 80 caractères']
        hint: "Phrase descriptive, faite pour le titre de page et les moteurs. Le nom court de l'ouvrage se saisit dans le champ suivant."

      - label: "Nom court de l'ouvrage"
        name: "ouvrage"
        widget: "string"
        required: false
        pattern: ['^.{2,40}$', "2 à 40 caractères"]
        hint: "Deux à quatre mots : le nom par lequel on désigne l'affaire (« Néréa », « Hôtel Le Yachtman », « Le Fougerou »). Ce n'est pas un raccourci du titre, c'est un nom. Il compose la légende de l'image principale, qui ne dispose que d'une ligne (32 signes sur mobile). Laissé vide, la légende se replie sur le découpage du titre."

      - label: "Secteur"
        name: "secteur"
        widget: "select"
        required: true
        options:
          - "Logements"
          - "Tertiaire / ERP"
          - "Industriel"
          - "Patrimoine"
          - "Monotechnique — Audit"
          - "Coordination SSI"
          - "Études d’exécution / BIM"
        hint: "Les sept secteurs d'activité de FT2E : quatre marchés du bâtiment, puis trois modes d'intervention portés comme segments à part entière. Cette liste est close — elle alimente les filtres de la page Références et le build refuse toute autre valeur."

      - label: "Typologie"
        name: "typologie"
        widget: "select"
        required: true
        options:
          - "Neuf"
          - "Réhabilitation"
          - "Extension"
          - "Étude"
          - "Études d’exécution"
        hint: "« Étude » = mission d'ingénierie sur un existant sans marché de travaux (audit, calcul de charges, faisabilité) : elle n'annonce aucun chantier. « Études d’exécution » = phase EXE d'une opération de travaux. Le mot s'affiche en chip de filtre sur /references."

      - label: "Maître d'ouvrage"
        name: "moa"
        widget: "string"
        required: true
        pattern: ['^.{2,}$', 'Deux caractères au minimum']

      - label: "Architecte"
        name: "architecte"
        widget: "string"
        required: false

      - label: "Lieu"
        name: "lieu"
        widget: "string"
        required: true
        pattern: ['^.{2,}$', 'Deux caractères au minimum']
        hint: "Commune (code postal). Ex : La Rochelle (17000)"

      - label: "Surface (m²)"
        name: "surface_m2"
        widget: "number"
        required: false
        value_type: "int"
        min: 1
        hint: "Nombre entier, sans unité ni séparateur de milliers — l'affichage ajoute « m² »."

      - label: "Référence d'affaire FT2E"
        name: "reference"
        widget: "string"
        required: false
        pattern: ['^\d{2}-\d{3}$', "Format attendu : NN-NNN (ex. 22-042)"]
        hint: "Numéro d'affaire relevé sur une pièce FT2E (« Affaire n° : 22-033 », cartouche de plan), jamais déduit du nom de dossier ni d'un autre champ. OBLIGATOIRE dès que « Contenu de démonstration » est décoché : sans lui, le build échoue. INTERDIT sur une fiche de démonstration — un numéro fabriqué entrerait en collision avec une affaire véritable."

      - label: "Année d'ouverture de l'affaire"
        name: "annee"
        widget: "number"
        required: true
        value_type: "int"
        min: 2008
        # Plafond = année en cours + 1 côté Zod : à relever chaque janvier.
        max: 2027
        hint: "Le millésime qu'encode la référence : 22-042 → 2022. Ce n'est ni l'année de DCE ni celle de la réception (voir « Année de livraison »). Le build refuse toute contradiction avec la référence."

      - label: "Statut de l'affaire"
        name: "statut"
        widget: "select"
        required: true
        default: "livré"
        options:
          - "livré"
          - "en cours"
          - "archive"
        hint: "passer à « livré » avant de renseigner l'année de livraison — sinon le build échoue sans message dans Decap. Le statut porte le rang de la nomenclature (opacité du filet) et s'affiche sur la fiche tant que la réception n'est pas prononcée."

      - label: "Année de livraison (réception prononcée)"
        name: "annee_livraison"
        widget: "number"
        required: false
        value_type: "int"
        min: 2008
        # Plafond = année en cours + 2 côté Zod : à relever chaque janvier.
        max: 2028
        hint: "À ne renseigner qu'une fois la réception actée sur pièce (PV, avis favorable). INTERDIT si le statut est « en cours », et ne peut pas précéder l'année d'ouverture."

      - label: "Synthèse"
        name: "synthese"
        widget: "text"
        required: false
        pattern: ['^[\s\S]{480,780}$', '480 à 780 signes']
        hint: "480 à 780 signes, espaces comprises. Texte autonome : il doit se lire seul, sans le récit ni le cadre technique. Une fiche qui ne peut pas atteindre 480 signes honnêtement reste SANS synthèse — le plancher n'autorise aucun remplissage, et le champ est facultatif pour cette raison."

      - label: "Performance énergétique"
        name: "performance"
        widget: "string"
        required: false
        hint: "Ex : RE2020 · Effinergie+"

      - label: "Mission FT2E"
        name: "mission_ft2e"
        widget: "select"
        multiple: true
        required: true
        min: 1
        options:
          - "CVC"
          - "Thermique"
          - "Électricité CFO"
          - "Électricité CFA"
          - "Photovoltaïque"
          - "SSI"
          - "BIM"
          - "Études d’exécution"
          - "Audit & diagnostic"
        hint: "Une mission au minimum. Liste close : le build refuse toute autre valeur. Six au maximum s'affichent proprement en étiquettes sur la fiche."

      - label: "Planche de schéma de principe"
        name: "planche"
        widget: "string"
        required: true
        pattern: ['^/images/projets/[a-z0-9-]+/planche\.svg$', 'Chemin attendu : /images/projets/<slug>/planche.svg']
        hint: "L'UNIQUE dispositif visuel d'une fiche : un dessin FT2E, sans géométrie d'ouvrage ni droit de tiers. Les cinq pièces (planche.svg, vignette.svg, appui.svg, planche.png, planche.json) sont produites ensemble et déposées telles quelles — elles ne se modifient pas ici. Le visuel photographique a été retiré du modèle le 2026-08-15 : il exposait le bureau au droit d'auteur des architectes."

      - label: "Mis en avant en accueil"
        name: "en_avant"
        widget: "boolean"
        default: false
        hint: "Maximum 4 projets mis en avant simultanément"

      - label: "Contenu de démonstration"
        name: "demo"
        widget: "boolean"
        default: false
        hint: "Cocher si les données ne sont pas encore confirmées par FT2E. Une fiche cochée doit avoir sa référence d'affaire VIDE ; une fiche décochée doit l'avoir renseignée."

      - label: "Récit projet"
        name: "body"
        widget: "markdown"
        hint: "Structure : Enjeu → Solution → Particularités → Résultat (3 à 6 paragraphes). Sous-titres en ## uniquement, jamais en #."

  # ───────────────── ACTUALITÉS ─────────────────
  - name: "actualites"
    label: "Actualités"
    label_singular: "Actualité"
    folder: "src/content/actualites"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{slug}}"
    identifier_field: titre
    summary: "{{date | date('YYYY-MM-DD')}} — {{titre}}"
    sortable_fields: [date, titre]
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true
        pattern: ['^.{5,80}$', '5 à 80 caractères']

      - label: "Chapô"
        name: "chapo"
        widget: "text"
        required: true
        pattern: ['^[\s\S]{40,280}$', '40 à 280 signes']
        hint: "2 à 3 phrases annonçant le contenu sans le résumer entièrement (40 à 280 signes, espaces comprises)."

      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        required: true
        format: "YYYY-MM-DD"
        date_format: true
        time_format: false

      - label: "Auteur"
        name: "auteur"
        widget: "string"
        required: false
        hint: "Prénom Nom — Fonction"


      - label: "Catégories"
        name: "categories"
        widget: "select"
        multiple: true
        required: true
        min: 1
        options:
          - "Chantier en cours"
          - "Livraison"
          - "Événement"
          - "Article technique"
          - "Vie du cabinet"
        hint: "Liste close : le build refuse toute autre valeur."

      - label: "Mis en avant"
        name: "en_avant"
        widget: "boolean"
        default: false

      - label: "Contenu de démonstration"
        name: "demo"
        widget: "boolean"
        default: false
        hint: "Cocher si les données ne sont pas encore confirmées par FT2E"

      - label: "Corps de l'article"
        name: "body"
        widget: "markdown"

  # ───────────────── ÉQUIPE ─────────────────
  - name: "equipe"
    label: "Équipe"
    label_singular: "Membre de l'équipe"
    folder: "src/content/equipe"
    create: true
    delete: false
    slug: "{{slug}}"
    identifier_field: prenom
    summary: "{{prenom}} — {{role}}"
    sortable_fields: [ordre, prenom]
    fields:
      - label: "Prénom"
        name: "prenom"
        widget: "string"
        required: true

      - label: "Nom"
        name: "nom"
        widget: "string"
        required: true
        hint: "Non affiché publiquement sur le site — donnée interne"

      - label: "Rôle / statut"
        name: "role"
        widget: "string"
        required: true
        hint: "Ex : Co-gérant associé, Associé, Collaboratrice"

      - label: "Fonction / métier"
        name: "fonction"
        widget: "string"
        required: true
        hint: "Ex : Ingénieur Efficacité Énergétique & Énergies Renouvelables"

      - label: "Spécialités"
        name: "specialites"
        widget: "list"
        required: true
        hint: "Une spécialité par ligne. Le champ est obligatoire : une fiche sans spécialité bloque le build."

      - label: "Formation"
        name: "formation"
        widget: "string"
        required: false

      - label: "Photo"
        name: "photo"
        widget: "image"
        required: true
        # Depuis le 2026-08-16 les photographies d'équipe vivent dans
        # `src/assets/equipe/`, pas dans `public/` : `astro:assets` ne traite que
        # ce qu'il RÉSOUT depuis `src/`, et `public/` est recopié tel quel.
        # Le chemin ENREGISTRÉ dans le .md reste public (`/images/equipe/…`) —
        # c'est le rendu qui le résout (src/lib/photos.ts). Sans ces deux lignes,
        # Decap déposerait le fichier dans `public/images/`, où le site ne le
        # verrait jamais et où il tomberait sur le repli en hachure.
        media_folder: "/src/assets/equipe"
        public_folder: "/images/equipe"
        hint: "Déposée dans src/assets/equipe/, enregistrée comme /images/equipe/<fichier>. Le site en tire l'AVIF, le WebP et le srcset au build — ne pas pré-compresser."

      - label: "Texte alternatif photo"
        name: "photo_alt"
        widget: "string"
        required: true
        pattern: ['^.{5,}$', 'Cinq caractères au minimum']
        hint: "Description de la photo, lue par les lecteurs d'écran. Cinq caractères au minimum."

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        required: true
        value_type: "int"

      - label: "Associé"
        name: "associe"
        widget: "boolean"
        default: true
        hint: "Distingue associés / collaborateurs (n'affecte pas l'affichage)"

  # ───────────────── EXPERTISES (édition seule) ─────────────────
  - name: "expertises"
    label: "Expertises"
    label_singular: "Expertise"
    folder: "src/content/expertises"
    create: false
    delete: false
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields: [ordre]
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true
        pattern: ['^.{3,60}$', '3 à 60 caractères']

      - label: "Accroche"
        name: "accroche"
        widget: "text"
        required: true
        pattern: ['^[\s\S]{20,200}$', '20 à 200 signes']
        hint: "Une à deux phrases (20 à 200 signes, espaces comprises)."

      - label: "Icône"
        name: "icone"
        widget: "string"
        required: true
        hint: "Nom du fichier SVG dans public/images/icons (sans extension)"

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        required: true
        value_type: "int"
        min: 1
        max: 99

      - label: "Livrables"
        name: "livrables"
        widget: "list"
        required: true

      - label: "Secteurs concernés"
        name: "typique_pour"
        widget: "select"
        multiple: true
        required: true
        options:
          - "Logements"
          - "Tertiaire / ERP"
          - "Industriel"
          - "Patrimoine"
          - "Monotechnique — Audit"
          - "Coordination SSI"
          - "Études d’exécution / BIM"
        hint: "Mêmes sept secteurs que les fiches projets — liste close, recopiée du schéma."

      - label: "Missions liées"
        name: "missions_liees"
        widget: "select"
        multiple: true
        required: false
        options:
          - "CVC"
          - "Thermique"
          - "Électricité CFO"
          - "Électricité CFA"
          - "Photovoltaïque"
          - "SSI"
          - "BIM"
          - "Études d’exécution"
          - "Audit & diagnostic"
        hint: "Mêmes missions que les fiches projets — sert à rattacher l'expertise aux références qui la mobilisent."

      - label: "FAQ"
        name: "faq"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        hint: "Deux à trois questions posées du point de vue du client (« Faut-il… », « À partir de quand… »), réponses de deux à quatre phrases. Ce champ engendre le JSON-LD FAQPage de la page : la laisser vide prive la page de cet enrichissement pour les moteurs et les assistants."
        fields:
          - { label: "Question", name: "question", widget: "string", required: true }
          - { label: "Réponse", name: "reponse", widget: "text", required: true }

      - label: "Corps de page"
        name: "body"
        widget: "markdown"

  # ───────────────── SECTEURS (édition seule) ─────────────────
  - name: "secteurs"
    label: "Secteurs"
    label_singular: "Secteur"
    folder: "src/content/secteurs"
    create: false
    delete: false
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields: [ordre, titre]
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true

      - label: "Accroche"
        name: "accroche"
        widget: "text"
        required: true
        pattern: ['^[\s\S]{40,240}$', '40 à 240 signes']
        hint: "40 à 240 signes, espaces comprises."

      - label: "Clichés du secteur"
        name: "cliches"
        widget: "list"
        required: true
        min: 3
        summary: "{{fields.legende}}"
        hint: "Le corpus photographique du secteur. Le film de l'accueil en tire quatre au hasard à chaque publication, avec au moins un cliché par famille renseignée ; le premier de la liste illustre aussi la page du secteur. Trois entrées au minimum, chacune complète."
        fields:
          - label: "Image"
            name: "image"
            widget: "image"
            required: true
            # Le fichier est déposé dans src/assets/secteurs/<slug>/ mais le
            # frontmatter enregistre la graphie publique /images/secteurs/<slug>/… :
            # c'est le rendu qui la résout (photoSecteur, src/lib/photos.ts) —
            # même mécanique que la photo d'équipe ci-dessus.
            media_folder: "/src/assets/secteurs/{{slug}}"
            public_folder: "/images/secteurs/{{slug}}"
            hint: "Photographie réelle uniquement — ni perspective d'architecte ni plan sur fond de tiers. Le site en tire l'AVIF, le WebP et le srcset au build."
          - label: "Légende"
            name: "legende"
            widget: "string"
            required: true
            pattern: ['^.{3,40}$', '3 à 40 signes']
            hint: "En minuscules, 18 signes au plus pour tenir sur une ligne du cartouche."
          - label: "Texte alternatif"
            name: "alt"
            widget: "string"
            required: true
            pattern: ['^.{10,}$', 'Dix caractères au minimum']
            hint: "Description du cliché, lue par les lecteurs d'écran."
          - label: "Crédit photographique"
            name: "credit"
            widget: "string"
            required: true
            default: "© FT2E"
          - label: "Famille"
            name: "famille"
            widget: "string"
            required: false
            hint: "Sous-famille du secteur (gros-collectif, petit-collectif, individuel-en-bande, erp, tertiaire). Le tirage du film garantit au moins un cliché par famille présente dans le corpus."

      - label: "Ordre"
        name: "ordre"
        widget: "number"
        required: true
        value_type: "int"

      - label: "Livrables"
        name: "livrables"
        widget: "list"
        required: false
        hint: "Cinq pièces remises au client sur ce type d'opération, en groupes nominaux courts. Les sept secteurs en portent depuis le 2026-08-10 : ce qui distingue un marché du bâtiment d'un segment de mission (Coordination SSI, EXE/BIM), c'est la nature des pièces, pas leur absence."

      - label: "FAQ"
        name: "faq"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        hint: "Deux à trois questions posées du point de vue du client (« Faut-il… », « À partir de quand… »), réponses de deux à quatre phrases. Ce champ engendre le JSON-LD FAQPage de la page : la laisser vide prive la page de cet enrichissement pour les moteurs et les assistants."
        fields:
          - { label: "Question", name: "question", widget: "string", required: true }
          - { label: "Réponse", name: "reponse", widget: "text", required: true }

      - label: "Corps de page"
        name: "body"
        widget: "markdown"
        hint: "Le texte de la page du secteur. ⚠ Sans ce champ, une édition depuis le CMS effacerait le corps existant."
