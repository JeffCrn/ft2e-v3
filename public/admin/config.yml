# ──────────────────────────────────────────────────────────────
# Decap CMS — Backend GitHub via proxy OAuth (solution temporaire)
#
# L'authentification passe par les fonctions Vercel /api/auth + /api/callback
# (le client_secret reste côté serveur). Variables d'env requises sur Vercel :
#   OAUTH_GITHUB_CLIENT_ID, OAUTH_GITHUB_CLIENT_SECRET
# OAuth App GitHub — Authorization callback URL :
#   https://ft2e-v2.vercel.app/api/callback
# ⚠ ft2e-v2 : au premier déploiement Vercel, reporter ces deux variables
# d'env sur le nouveau projet et mettre à jour la callback de l'OAuth App
# GitHub (ou créer une seconde OAuth App dédiée à la v2).
# À refaire au passage en production (OVH/souverain). Voir docs/20.
# ──────────────────────────────────────────────────────────────

backend:
  name: github
  repo: JeffCrn/ft2e-v2
  branch: master
  base_url: https://ft2e-v2.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images"
public_folder: "/images"

locale: fr

site_url: https://ft2e.fr
display_url: https://ft2e.fr
logo_url: /favicon.svg

collections:

  # ───────────────── PROJETS / RÉFÉRENCES ─────────────────
  - name: "projets"
    label: "Projets / Références"
    label_singular: "Projet"
    folder: "src/content/projets"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}} — {{lieu}} ({{annee}})"
    sortable_fields: [annee, titre, secteur]
    view_filters:
      - { label: "Mis en avant", field: en_avant, pattern: true }
      - { label: "Logement", field: secteur, pattern: "Logement" }
      - { label: "Tertiaire", field: secteur, pattern: "Tertiaire" }
      - { label: "Santé", field: secteur, pattern: "Santé" }
      - { label: "Sport", field: secteur, pattern: "Sport" }
      - { label: "Industriel", field: secteur, pattern: "Industriel" }
      - { label: "Patrimoine", field: secteur, pattern: "Patrimoine" }
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true
        pattern: ['.{2,80}', '2 à 80 caractères']

      - label: "Secteur"
        name: "secteur"
        widget: "select"
        required: true
        options:
          - "Logement"
          - "Tertiaire"
          - "Santé"
          - "Sport"
          - "Industriel"
          - "Patrimoine"

      - label: "Typologie"
        name: "typologie"
        widget: "select"
        required: true
        options:
          - "Neuf"
          - "Réhabilitation"
          - "Extension"
          - "Études d'exécution"

      - label: "Maître d'ouvrage"
        name: "moa"
        widget: "string"
        required: true

      - label: "Architecte"
        name: "architecte"
        widget: "string"
        required: false

      - label: "Lieu"
        name: "lieu"
        widget: "string"
        required: true
        hint: "Commune (code postal). Ex : La Rochelle (17000)"

      - label: "Surface (m²)"
        name: "surface_m2"
        widget: "number"
        required: false
        value_type: "int"
        min: 1

      - label: "Référence d'affaire FT2E"
        name: "reference"
        widget: "string"
        required: false
        pattern: ['^\d{2}-\d{3}$', "Format attendu : NN-NNN (ex. 22-042)"]
        hint: "Numéro d'affaire relevé sur une pièce FT2E (« Affaire n° : 22-033 », cartouche de plan). Obligatoire pour une référence réelle ; à laisser vide sur une fiche de démonstration."

      - label: "Année d'ouverture de l'affaire"
        name: "annee"
        widget: "number"
        required: true
        value_type: "int"
        min: 2008
        max: 2030
        hint: "Le millésime qu'encode la référence : 22-042 → 2022. Ce n'est ni l'année de DCE ni celle de la réception. Le build refuse toute contradiction avec la référence."

      - label: "Année de livraison (réception prononcée)"
        name: "annee_livraison"
        widget: "number"
        required: false
        value_type: "int"
        min: 2008
        max: 2030
        hint: "À ne renseigner qu'une fois la réception actée sur pièce (PV, avis favorable). Interdit si le statut est « en cours »."

      - label: "Performance énergétique"
        name: "performance"
        widget: "string"
        required: false
        hint: "Ex : RE2020 · Effinergie+"

      - label: "Mission FT2E"
        name: "mission_ft2e"
        widget: "select"
        multiple: true
        required: true
        min: 1
        options:
          - "CVC"
          - "Thermique"
          - "Électricité CFO"
          - "Électricité CFA"
          - "SSI"
          - "BIM"
          - "Études d'exécution"
          - "Audit & diagnostic"

      - label: "Image principale"
        name: "image_principale"
        widget: "image"
        required: true

      - label: "Texte alternatif image"
        name: "image_principale_alt"
        widget: "string"
        required: true
        hint: "Description du visuel, lue par les lecteurs d'écran"

      - label: "Galerie"
        name: "galerie"
        widget: "list"
        required: false
        summary: "{{fields.alt}}"
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Légende / alt", name: "alt", widget: "string" }

      - label: "Mis en avant en accueil"
        name: "en_avant"
        widget: "boolean"
        default: false
        hint: "Maximum 4 projets mis en avant simultanément"

      - label: "Contenu de démonstration"
        name: "demo"
        widget: "boolean"
        default: false
        hint: "Cocher si les données ne sont pas encore confirmées par FT2E"

      - label: "Récit projet"
        name: "body"
        widget: "markdown"
        hint: "Structure : Enjeu → Solution → Particularités → Résultat (3 à 6 paragraphes)"

  # ───────────────── ACTUALITÉS ─────────────────
  - name: "actualites"
    label: "Actualités"
    label_singular: "Actualité"
    folder: "src/content/actualites"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{slug}}"
    identifier_field: titre
    summary: "{{date | date('YYYY-MM-DD')}} — {{titre}}"
    sortable_fields: [date, titre]
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true
        pattern: ['.{5,80}', '5 à 80 caractères']

      - label: "Chapô"
        name: "chapo"
        widget: "text"
        required: true
        hint: "2 à 3 phrases annonçant le contenu (40 à 280 caractères)"

      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        required: true
        format: "YYYY-MM-DD"
        date_format: true
        time_format: false

      - label: "Auteur"
        name: "auteur"
        widget: "string"
        required: false
        hint: "Prénom Nom — Fonction"

      - label: "Image d'illustration"
        name: "image"
        widget: "image"
        required: false

      - label: "Texte alternatif image"
        name: "image_alt"
        widget: "string"
        required: false

      - label: "Catégories"
        name: "categories"
        widget: "select"
        multiple: true
        required: true
        min: 1
        options:
          - "Chantier en cours"
          - "Livraison"
          - "Événement"
          - "Article technique"
          - "Vie du cabinet"

      - label: "Mis en avant"
        name: "en_avant"
        widget: "boolean"
        default: false

      - label: "Contenu de démonstration"
        name: "demo"
        widget: "boolean"
        default: false

      - label: "Corps de l'article"
        name: "body"
        widget: "markdown"

  # ───────────────── ÉQUIPE ─────────────────
  - name: "equipe"
    label: "Équipe"
    label_singular: "Membre de l'équipe"
    folder: "src/content/equipe"
    create: true
    delete: false
    slug: "{{slug}}"
    identifier_field: prenom
    summary: "{{prenom}} — {{role}}"
    sortable_fields: [ordre, prenom]
    fields:
      - label: "Prénom"
        name: "prenom"
        widget: "string"
        required: true

      - label: "Nom"
        name: "nom"
        widget: "string"
        required: true
        hint: "Non affiché publiquement sur le site — donnée interne"

      - label: "Rôle / statut"
        name: "role"
        widget: "string"
        required: true
        hint: "Ex : Co-gérant associé, Associé, Collaboratrice"

      - label: "Fonction / métier"
        name: "fonction"
        widget: "string"
        required: true
        hint: "Ex : Ingénieur Efficacité Énergétique & Énergies Renouvelables"

      - label: "Spécialités"
        name: "specialites"
        widget: "list"
        required: false

      - label: "Formation"
        name: "formation"
        widget: "string"
        required: false

      - label: "Photo"
        name: "photo"
        widget: "image"
        required: true

      - label: "Texte alternatif photo"
        name: "photo_alt"
        widget: "string"
        required: true
        hint: "Description de la photo, lue par les lecteurs d'écran"

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        required: true
        value_type: "int"

      - label: "Associé"
        name: "associe"
        widget: "boolean"
        default: true
        hint: "Distingue associés / collaborateurs (n'affecte pas l'affichage)"

      - label: "Email contact"
        name: "contact_email"
        widget: "string"
        required: false
        pattern: ['^[^@]+@[^@]+\.[^@]+$', 'Adresse email valide']

  # ───────────────── EXPERTISES (édition seule) ─────────────────
  - name: "expertises"
    label: "Expertises"
    label_singular: "Expertise"
    folder: "src/content/expertises"
    create: false
    delete: false
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields: [ordre]
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true

      - label: "Accroche"
        name: "accroche"
        widget: "text"
        required: true

      - label: "Icône"
        name: "icone"
        widget: "string"
        required: true
        hint: "Nom du fichier SVG dans public/images/icons (sans extension)"

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        required: true
        value_type: "int"

      - label: "Livrables"
        name: "livrables"
        widget: "list"
        required: true

      - label: "Secteurs concernés"
        name: "typique_pour"
        widget: "select"
        multiple: true
        options:
          - "Logement"
          - "Tertiaire"
          - "Santé"
          - "Sport"
          - "Industriel"
          - "Patrimoine"

      - label: "FAQ"
        name: "faq"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Réponse", name: "reponse", widget: "text" }

      - label: "Corps de page"
        name: "body"
        widget: "markdown"

  # ───────────────── SECTEURS (édition seule) ─────────────────
  - name: "secteurs"
    label: "Secteurs"
    label_singular: "Secteur"
    folder: "src/content/secteurs"
    create: false
    delete: false
    slug: "{{slug}}"
    identifier_field: titre
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        required: true

      - label: "Accroche"
        name: "accroche"
        widget: "text"
        required: true

      - label: "Image"
        name: "image"
        widget: "image"
        required: true

      - label: "Texte alternatif image"
        name: "image_alt"
        widget: "string"
        required: true

      - label: "Ordre"
        name: "ordre"
        widget: "number"
        required: true
        value_type: "int"
