  <text x="440.00" y="540.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LE DÉBIT N'EST JAMAIS ATTEINT</text>
  <text x="440.00" y="556.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">L'HUMIDITÉ DU LAVAGE RESTE SUR PLACE</text>
  <text x="440.00" y="572.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LES MURS RUISSELLENT, HOTTE EN MARCHE</text>
  <text x="800.00" y="556.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">HYPOTHÈSE DU RAPPORT : COMPENSATION COUPÉE</text>
  <text x="800.00" y="572.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">PARCE QU'ELLE SOUFFLAIT FROID EN HIVER</text>
