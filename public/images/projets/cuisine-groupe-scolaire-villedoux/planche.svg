<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Coupe de principe de l'équilibre aéraulique du restaurant scolaire : trois locaux sous une même ligne de toiture, l'air extrait fléché vers le haut, l'air de compensation en trait interrompu là où le relevé ne l'a pas constaté. Salles de restauration : centrale double flux de 2 340 m³/h, voyant de marche allumé mais aucun débit en toiture. Laverie : hotte de 1 800 m³/h sans aucune compensation d'air neuf — le local passe en dépression et l'humidité ruisselle. Zone cuisson : hotte du piano à 7 500 m³/h, dont la compensation de 6 000 m³/h préchauffés par une batterie électrique signalée en surchauffe est supposée coupée. Seuls deux caissons simple flux tournaient au relevé.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
