  <text x="56.00" y="220.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">TRAIT PLEIN · L'AIR QUI PASSE — TRAIT INTERROMPU · L'AIR QUI DEVRAIT PASSER</text>
