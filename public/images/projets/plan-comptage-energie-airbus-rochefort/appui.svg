<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe d’un plan de comptage de l’énergie de chauffage sur un site industriel. À gauche, la chaufferie O : un départ unique alimente quatre bâtiments, D, B, C et A, et leurs retours reviennent au collecteur en passant chacun par un compteur d’énergie — un compteur en DN 125 pour le bâtiment D, trois pour le bâtiment B, en DN 50 après le circulateur et en DN 65 et DN 40 sur les réseaux des aérothermes, un compteur en DN 100 pour le bâtiment C. Le bâtiment A, dont le réseau se ramifie en une multitude de branches, ne reçoit aucun compteur : un compteur général en DN 200 sur le retour commun mesure le total, et le bâtiment A se compte par soustraction des trois autres. À droite, le bilan du site : quatre chaufferies gaz et 18 départs secondaires, sept compteurs existants — cinq à la chaufferie CH, deux à la chaufferie V — et 18 compteurs à installer, trois à la chaufferie CH, six à la chaufferie O, six à la chaufferie Vauban, trois à la chaufferie V, soit 25 compteurs. Le compteur se pose sur le retour, après cinq diamètres de tuyauterie droite ; un bâtiment trop ramifié se compte par soustraction.">
