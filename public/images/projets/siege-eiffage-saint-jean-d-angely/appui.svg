<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la récupération d’énergie entre zones d’un même bâtiment. À gauche, l’unité extérieure de la pompe à chaleur à détente directe ; au-dessus d’elle, une flèche mince vers le haut, le rejet, qui ne porte que le solde. De l’unité extérieure partent deux tubes seulement, le liquide et le gaz, tracés en deux traits parallèles jusqu’au boîtier principal. Ce boîtier sépare le liquide du gaz et oriente chaque branche ; il alimente deux boîtiers secondaires, l’un à quatre départs, l’autre à huit, dessinés chacun avec ses départs en éventail. À droite, deux terminaux du même boîtier à huit départs sont nommés : en haut un bureau en demande de froid, qui prend la chaleur de son local ; en bas un bureau en demande de chaud, qui la reçoit. Un trajet épais les relie : il part du terminal froid, revient au boîtier, fait demi-tour à l’intérieur, et redescend vers le terminal chaud. Il ne franchit jamais la ligne des deux tubes et n’atteint jamais l’unité extérieure. En bas, détaché par un filet et hors du système, le local serveur : sa propre machine, aucun boîtier, et sa propre flèche de rejet vers le haut, parce qu’il demande du froid toute l’année et n’a jamais rien à rendre au reste du bâtiment.">
