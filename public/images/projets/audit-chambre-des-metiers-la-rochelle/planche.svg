<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe en coupe, sur un seul plan : celui de la toiture-terrasse, tracé en travers du dessin et interrompu en deux endroits. Au-dessus s’étend la bande de l’extérieur — air marin, volatiles, eau stagnante ; en dessous, celle du quatrième étage et de ses quatre sous-stations. Quatre organes de la production y sont rangés au même pas, et leur position dit leur régime. Les deux premiers restent au-dessus du plan : la pompe à chaleur sud, remplacée, porte un capot posé sur elle ; la pompe à chaleur nord, remise en état, reçoit un grillage anti-volatiles et deux plots de surélévation qui la décollent de la dalle. Les deux autres franchissent le plan vers le bas : à leur position d’origine ne subsiste qu’une boîte au trait interrompu, une flèche descend et perce le plan par une brèche, et la boîte pleine se trouve en dessous — le module hydraulique déporté en sous-station, puis le ballon tampon déplacé au même endroit. Enfin deux traits horizontaux traversent tout le dessin : en haut, interrompu, le cheminement de quartier à quartier en toiture, supprimé ; en bas, plein, les liaisons entre sous-stations par les plénums intérieurs. Le trait plein marque partout la position retenue, le trait interrompu la position abandonnée.">
