  <text x="56.00" y="190.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">TRAIT PLEIN = POSITION RETENUE · TRAIT INTERROMPU = POSITION ABANDONNÉE · LA BRÈCHE DU PLAN EST LA TRAVERSÉE</text>
  <text x="56.00" y="226.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">EXTÉRIEUR — AIR MARIN, VOLATILES, EAU STAGNANTE</text>
