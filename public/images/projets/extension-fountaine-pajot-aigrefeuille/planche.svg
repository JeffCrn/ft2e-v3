  <text x="741.25" y="622.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">COURBE D</text>
  <path d="M 857.75 536.00 L 857.75 568.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.4"/>
