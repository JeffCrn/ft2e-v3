  <text x="256.00" y="404.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">POSÉE DANS L’ATELIER EXISTANT</text>
  <text x="256.00" y="424.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ARRIVÉE 4 × 800 A  · RÉGIME TN-S</text>
  <text x="256.00" y="444.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">RÉSERVE DE 30 % EN PUISSANCE ET EN PLACE</text>
