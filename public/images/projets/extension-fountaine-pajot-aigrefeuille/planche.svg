  <rect x="56.00" y="560.00" width="264.00" height="60.00" class="c-calcaire s-filet-3" fill="#EDF0F2" stroke="#00393A1F" stroke-width="1"/>
  <text x="72.00" y="588.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Armoire de l’atelier 4</text>
  <text x="72.00" y="608.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">DÉPOSÉE, SES CIRCUITS REPRIS</text>
  <rect x="600.00" y="373.00" width="72.00" height="14.00" class="c-encre" fill="#00393A"/>
  <path d="M 688.00 380.00 L 672.00 372.00 L 672.00 388.00 Z" class="c-encre" fill="#00393A"/>
