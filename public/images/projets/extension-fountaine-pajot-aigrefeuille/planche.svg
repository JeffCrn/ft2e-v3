  .c-filet-1 { fill: var(--color-filet-1, #00393A38); }
  .c-filet-2 { fill: var(--color-filet-2, #00393A29); }
  .c-filet-3 { fill: var(--color-filet-3, #00393A1F); }
  .s-filet-1 { stroke: var(--color-filet-1, #00393A38); }
  .s-filet-3 { stroke: var(--color-filet-3, #00393A1F); }
  .s-encre { stroke: var(--color-encre, #00393A); }
  .t-sans { font-family: "Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif; }
  .t-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
  <rect x="0.00" y="0.00" width="1200.00" height="800.00" class="c-papier" fill="#F7F9FA"/>
  <text x="56.00" y="76.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" letter-spacing="1.54">ALIMENTATION GÉNÉRALE  · EXTENSION D’UN BÂTIMENT INDUSTRIEL EN EXPLOITATION</text>
  <text x="56.00" y="112.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="30" font-weight="700" font-variation-settings="'wdth' 112, 'wght' 700">Extension Fountaine Pajot</text>
  <text x="56.00" y="138.00" class="t-sans c-pivot" fill="#336667" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="16" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">L’extension n’a pas de source : ses 500 kVA sont pris sur le poste de l’usine</text>
  <rect x="56.00" y="160.00" width="1088.00" height="1.00" class="c-filet-1" fill="#00393A38"/>
  <text x="56.00" y="186.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">CE QUE L’EXTENSION DEMANDE, ET D’OÙ ELLE LE PREND</text>
  <text x="56.00" y="214.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">L’ATELIER EXISTANT, QUI NE DOIT PAS PERDRE SON ÉLECTRICITÉ</text>
  <text x="688.00" y="214.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">L’EXTENSION, QUI NE REÇOIT AUCUNE SOURCE PROPRE</text>
  <path d="M 664.00 232.00 L 664.00 648.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.2" stroke-dasharray="5 5"/>
  <rect x="56.00" y="240.00" width="244.00" height="68.00" class="c-calcaire s-filet-1" fill="#EDF0F2" stroke="#00393A38" stroke-width="1"/>
  <text x="72.00" y="274.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Poste de transformation</text>
  <text x="72.00" y="294.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">EXISTANT  · DÉJÀ EN SERVICE</text>
  <text x="600.00" y="244.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">800 kVA AU POSTE EXISTANT</text>
  <rect x="320.00" y="252.00" width="280.00" height="30.00" class="c-papier s-filet-1" fill="#F7F9FA" stroke="#00393A38" stroke-width="1"/>
