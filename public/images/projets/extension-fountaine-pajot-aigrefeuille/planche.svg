  <text x="704.00" y="484.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">POSÉE AVANT LA CHARPENTE</text>
