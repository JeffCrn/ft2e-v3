  <text x="320.00" y="300.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">500 kVA FOISONNÉS, RÉSERVE DE 30 % COMPRISE</text>
  <path d="M 178.00 308.00 L 178.00 328.00 L 420.00 328.00 L 420.00 348.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="2.0"/>
  <rect x="240.00" y="348.00" width="360.00" height="152.00" class="c-papier s-filet-1" fill="#F7F9FA" stroke="#00393A38" stroke-width="1"/>
