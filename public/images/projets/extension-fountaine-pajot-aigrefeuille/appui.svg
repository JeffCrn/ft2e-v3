  <rect x="24.00" y="56.00" width="504.00" height="22.00" class="c-papier s-filet-1" fill="#F7F9FA" stroke="#00393A38" stroke-width="1"/>
  <rect x="24.00" y="56.00" width="315.00" height="22.00" class="c-encre" fill="#00393A"/>
  <text x="24.00" y="96.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" font-variant-numeric="tabular-nums">500 kVA</text>
  <text x="528.00" y="96.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end" font-variant-numeric="tabular-nums">800 kVA</text>
