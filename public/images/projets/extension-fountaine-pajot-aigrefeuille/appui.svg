<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de l’alimentation électrique d’une extension industrielle greffée sur une usine en exploitation. À gauche d’une limite verticale, l’atelier existant : un poste de transformation déjà en service de 800 kVA, dont une jauge montre que l’extension prend 500 kVA, réserve de 30 % comprise ; sous ce poste, l’armoire générale basse tension de l’extension, posée dans l’atelier existant et non dans l’extension, avec une arrivée de 4 × 800 ampères en régime TN-S ; et, plus bas, la branche barrée de l’armoire de l’atelier 4, neutralisée avant démolition puis déposée. De cette armoire partent deux liaisons qui franchissent la limite, dessinées à des épaisseurs proportionnelles à leur calibre : une liaison épaisse de 4 × 630 ampères vers le tableau général de l’extension, qui se répartit ensuite en quatre départs — ponts roulants en courbe D, éclairage à huit luminaires par phase, enrouleurs par groupes de trois, tableau des bureaux sur mezzanine ; et une liaison deux fois et demie plus fine de 4 × 250 ampères vers l’armoire de la centrale de traitement d’air, posée avant la charpente de la halle qu’elle dessert.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
  .c-pivot { fill: var(--color-pivot, #336667); }
  .c-clair { fill: var(--color-clair, #99CCCD); }
  .c-voile { fill: var(--color-voile, #E1F4F4); }
  .c-papier { fill: var(--color-papier, #F7F9FA); }
  .c-calcaire { fill: var(--color-calcaire, #EDF0F2); }
  .c-filet-1 { fill: var(--color-filet-1, #00393A38); }
  .c-filet-2 { fill: var(--color-filet-2, #00393A29); }
  .c-filet-3 { fill: var(--color-filet-3, #00393A1F); }
  .s-filet-1 { stroke: var(--color-filet-1, #00393A38); }
  .s-filet-3 { stroke: var(--color-filet-3, #00393A1F); }
  .s-encre { stroke: var(--color-encre, #00393A); }
  .t-sans { font-family: "Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif; }
  .t-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
