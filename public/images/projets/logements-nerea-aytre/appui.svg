<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe du dédoublement contractuel d’une opération de logements : un même permis de construire en co-titularité porte 90 logements et un commerce en cinq bâtiments, et se partage entre deux marchés — 42 logements en accession libre et le commerce vers les bâtiments A et B, côté promoteur ; 30 logements en locatif social et 18 en accession sociale, soit 48, vers les bâtiments C, D et E, côté bailleur social. Une bande unique traverse les deux flux : le même bureau d’études fluides, qui tient pour les deux maîtres d’ouvrage deux jeux complets de pièces, deux calculs réglementaires et treize jalons de rendu alternés. Les exigences diffèrent d’un marché à l’autre : NF Habitat sans exigence thermique côté promoteur ; NF Habitat HQE profil Très Performant, soit la RT2012 moins 20 pour cent, côté bailleur.">
