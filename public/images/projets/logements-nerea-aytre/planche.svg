  <text x="895.00" y="518.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LA RT2012 MOINS 20 % EXIGÉE</text>
