  <text x="635.00" y="628.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">DEUX JEUX DE PIÈCES · DEUX CALCULS RÉGLEMENTAIRES · TREIZE JALONS ALTERNANT D'UN MAÎTRE D'OUVRAGE À L'AUTRE</text>
  <text x="56.00" y="688.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Les installations, elles, restent tenues par une même logique.</text>
