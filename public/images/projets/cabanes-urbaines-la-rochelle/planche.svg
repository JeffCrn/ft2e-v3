<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la mesure compensatoire de sécurité incendie d’un établissement sportif et culturel de trois niveaux. Les planchers n’ont pas été traités coupe-feu : aucun recoupement horizontal ne sépare les niveaux, et deux traits interrompus le figurent entre les étages. En compensation, la détection est généralisée : quatorze zones sur trois niveaux — onze zones de détection automatique et trois zones de déclencheurs manuels, une par niveau —, soit quatre zones au second étage (pôle santé, salle de yoga, circulations et combles), quatre au premier étage (bureaux, salles d’enseignement, circulations et combles) et six au rez-de-chaussée (salle d’escalade, salle de spectacles et autres locaux, circulations, cuisine, restaurant). L’installation compte 87 détecteurs automatiques et 16 déclencheurs manuels, soit 103 points adressés un à un sur une centrale de catégorie A à équipement d’alarme de type 1 qui en admet 128. Une accolade unique embrasse les trois niveaux et aboutit à l’équation portée par les plans de zonage : une seule zone d’alarme et une seule zone de compartimentage, le bâtiment, sans temporisation. Deux fonctions restent hors du centralisateur, en filet interrompu : les clapets coupe-feu, autocommandés par fusible thermique faute de limite de compartimentage à tenir, et le désenfumage des cages d’escalier, commandé à la main en pied d’escalier. En bande basse, la vérification de la compensation par deux foyers de contrôle d’efficacité allumés à la réception : deux plaques et demie de mousse en salle d’escalade, sous six mètres de hauteur libre, déclenchent en 2 minutes 30 secondes ; neuf bûchettes de hêtre en salle d’enseignement déclenchent en 11 minutes 20 secondes. Les longueurs des deux barres sont proportionnelles à ces deux durées.">
