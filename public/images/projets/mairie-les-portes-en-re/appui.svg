<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Chronologie de principe d’une réhabilitation en site occupé : de 2023 à 2025, deux chantiers se succèdent — l’office de tourisme au printemps 2023, créé dans l’emprise de la salle des fêtes, puis la mairie et la salle des fêtes elles-mêmes, de février 2024 à avril 2025, au fil de 55 comptes rendus de chantier — pendant qu’une ligne continue porte le service public, accueil, police municipale et agence postale, sans interruption sur toute la durée. La salle des fêtes libérée par le premier chantier permet le second, et la mairie réaménagée est livrée au printemps 2025.">
