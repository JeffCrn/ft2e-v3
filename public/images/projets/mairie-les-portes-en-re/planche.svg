  <text x="542.94" y="481.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">55 COMPTES RENDUS DE CHANTIER</text>
  <text x="1048.79" y="463.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">FÉVR. 2024 → AVR. 2025</text>
  <path d="M 1062.79 496.00 L 1062.79 600.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
  <text x="1054.79" y="552.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">LIVRAISON · PRINTEMPS 2025</text>
  <path d="M 56.00 600.00 L 1144.00 600.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
