  <text x="56.00" y="190.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">SIX LOCAUX, CHACUN SON ÉQUIPEMENT · L’AIR CONVERGE VERS TROIS GROUPES D’EXTRACTION</text>
