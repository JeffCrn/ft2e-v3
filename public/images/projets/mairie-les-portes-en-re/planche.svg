<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe des lots fluides d’une mairie réhabilitée, sans production centrale : six locaux portent chacun leur équipement propre — l’accueil du public un rideau d’air chaud asservi au contact de porte, la salle du conseil et des mariages une pompe à chaleur monosplit au R32 de 7 kW en chaud et 6 kW en froid, les bureaux des panneaux rayonnants dimensionnés sur des déperditions calculées pièce par pièce, les archives des bouches coupe-feu, le local serveur un refroidissement par extraction. L’air entre par les menuiseries de l’accueil, de la salle et des bureaux, puis rejoint trois groupes d’extraction basse consommation dimensionnés par zone — 120 m³/h aux sanitaires, 515 m³/h aux bureaux, 915 m³/h aux archives — et vers le caisson du local serveur, 900 m³/h régulé par sonde de température. Aucun nœud central : chaque local reçoit la réponse dimensionnée pour son usage.">
