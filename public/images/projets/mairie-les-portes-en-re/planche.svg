  <rect x="126.46" y="330.00" width="144.51" height="56.00" class="c-calcaire s-filet-1" fill="#EDF0F2" stroke="#00393A38" stroke-width="1"/>
  <text x="140.46" y="361.50" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">PRINTEMPS 2023</text>
  <text x="284.97" y="353.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Office de tourisme</text>
  <text x="284.97" y="371.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">CRÉÉ DANS L’EMPRISE DE LA SALLE DES FÊTES</text>
  <path d="M 270.97 358.00 L 528.94 358.00 L 528.94 433.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
