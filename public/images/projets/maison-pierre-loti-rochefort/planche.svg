  <text x="56.00" y="418.76" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">UNE FUMÉE EST DÉTECTÉE</text>
  <text x="56.00" y="432.76" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">— N’IMPORTE OÙ</text>
