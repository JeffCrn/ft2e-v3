  <text x="56.00" y="688.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Toute détection rend la lumière, tait la sonorisation, arrête l’air et sonne l’alarme dans tout le musée.</text>
