  <text x="916.00" y="395.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" font-variant-numeric="tabular-nums">LES SALLES TAMISÉES RALLUMÉES</text>
