<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la mise en sécurité incendie : deux familles de détection — 46 détecteurs radio sur piles avec huit déclencheurs manuels radio, et 38 détecteurs filaires avec onze déclencheurs — convergent vers une centrale adressable de catégorie A à équipement d’alarme de type 1. Le bâtiment ne forme qu’une seule zone d’alarme : toute détection commande simultanément l’alarme générale à 90 dB, la remise en lumière des salles que la scénographie tamise, l’arrêt de la sonorisation et l’arrêt des centrales de traitement d’air. L’alarme se reporte à l’accueil et au bâtiment DAC, avec renvoi vers un poste de télésurveillance.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
