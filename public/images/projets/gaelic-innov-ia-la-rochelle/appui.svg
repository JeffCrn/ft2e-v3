<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de deux découpages superposés d’un même bâtiment. La bande centrale porte les trois volumes de l’opération, de gauche à droite : le laboratoire restructuré, le bâtiment de liaison et l’open space, leurs largeurs proportionnées aux débits de leurs centrales de ventilation. Au-dessus, le découpage réglementaire : un crochet continu embrasse la liaison et l’open space en une seule zone de calcul RT2012, d’un seul usage industriel, tandis que le laboratoire, resté sous l’arrêté du 3 mai 2007, ne porte que des marques isolées, une par élément touché — mur, toiture, plancher, équipement —, que rien ne relie entre elles. Au-dessous, le découpage de l’air : un crochet par volume, trois centrales double flux indépendantes de 510, 430 et 850 mètres cubes par heure, et sous le seul laboratoire cinq extractions dédiées, une par local d’essai, de 100 à 190 mètres cubes par heure, dont l’air est rejeté sans repasser par aucun échangeur. La frontière entre la liaison et l’open space existe pour l’air et n’existe pas pour le calcul : un trait vertical la remonte et bute contre le crochet continu.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
