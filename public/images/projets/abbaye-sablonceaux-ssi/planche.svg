<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe du zonage de l'alarme incendie : un même déclenchement de détecteur est suivi avant et après travaux. Avant : le SDI d'origine, une seule zone d'alarme sans temporisation, sonne l'évacuation générale des 3 370 m². Après : la centrale de catégorie A, adressable point par point, ne diffuse l'alarme que dans la zone concernée — quatre zones d'alarme dont une provisionnée pour le bâtiment Figuier ; l'aile François-Xavier, hors zonage, passe en détecteurs avertisseurs autonomes de fumée.">
