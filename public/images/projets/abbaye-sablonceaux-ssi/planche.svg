<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe du zonage de l'alarme incendie : à l'origine, une seule zone d'alarme sans temporisation couvrait les 3 370 m² et le moindre déclenchement sonnait l'évacuation générale ; le nouveau système, de catégorie A et adressable point par point, découpe l'alarme en trois zones sans temporisation — Moines-Logis, aile Jonas, bâtiment communautaire —, plus une quatrième provisionnée pour le bâtiment Figuier ; l'aile François-Xavier, hors classement, passe en détecteurs avertisseurs autonomes de fumée.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
  .c-pivot { fill: var(--color-pivot, #336667); }
  .c-clair { fill: var(--color-clair, #99CCCD); }
  .c-voile { fill: var(--color-voile, #E1F4F4); }
  .c-papier { fill: var(--color-papier, #F7F9FA); }
  .c-calcaire { fill: var(--color-calcaire, #EDF0F2); }
  .c-filet-1 { fill: var(--color-filet-1, #00393A38); }
  .c-filet-2 { fill: var(--color-filet-2, #00393A29); }
  .c-filet-3 { fill: var(--color-filet-3, #00393A1F); }
  .s-filet-1 { stroke: var(--color-filet-1, #00393A38); }
  .s-filet-2 { stroke: var(--color-filet-2, #00393A29); }
  .s-filet-3 { stroke: var(--color-filet-3, #00393A1F); }
  .s-encre { stroke: var(--color-encre, #00393A); }
  .t-sans { font-family: "Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif; }
  .t-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
