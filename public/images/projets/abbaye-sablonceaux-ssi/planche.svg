  <text x="714.00" y="190.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">L'AFFAIRE · DU DIAGNOSTIC À LA RÉCEPTION · 2023–2026</text>
