  <text x="642.00" y="243.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">3 370 m²</text>
