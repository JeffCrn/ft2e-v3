  <text x="1144.00" y="524.00" class="t-sans c-pivot" fill="#336667" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="22" font-weight="700" font-variation-settings="'wdth' 118, 'wght' 700" text-anchor="end" font-variant-numeric="tabular-nums">30 juin 2026</text>
