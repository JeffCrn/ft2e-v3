  <text x="714.00" y="268.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ÉVACUÉS EN TOTALITÉ AU MOINDRE DÉCLENCHEMENT</text>
  <text x="714.00" y="282.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">UNE SEULE ZONE D'ALARME À L'ORIGINE, SANS TEMPORISATION</text>
