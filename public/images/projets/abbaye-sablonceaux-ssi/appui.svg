  <text x="312.00" y="130.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">EN ALARME — ÉVACUE</text>
  <rect x="300.00" y="143.00" width="228.00" height="59.00" class="c-calcaire s-filet-1" fill="#EDF0F2" stroke="#00393A38" stroke-width="1"/>
  <text x="312.00" y="162.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ZONE D’ALARME 2</text>
  <text x="312.00" y="182.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="13" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Aile Jonas</text>
  <rect x="300.00" y="210.00" width="228.00" height="59.00" class="c-calcaire s-filet-1" fill="#EDF0F2" stroke="#00393A38" stroke-width="1"/>
  <text x="312.00" y="229.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ZONE D’ALARME 3</text>
  <text x="312.00" y="249.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="13" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Bâtiment communautaire</text>
  <rect x="300.00" y="277.00" width="228.00" height="59.00" class="c-papier s-filet-2" fill="#F7F9FA" stroke="#00393A29" stroke-width="1"/>
