  <text x="38.00" y="218.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" font-variant-numeric="tabular-nums">3 370 m²</text>
  <path d="M 228.00 206.00 L 284.00 206.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
