<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Chronologie de principe des études d'exécution : de janvier à avril 2026, les réservations montent le bâtiment niveau par niveau — attentes au sol du rez-de-chaussée le 16 janvier, planchers bois du R+1 au R+4 en février, toiture début mars —, chaque diffusion figeant son niveau avant exécution, car rien ne se perce dans un plancher bois après coup ; suivent les plans d'exécution plomberie et chauffage-rafraîchissement, repris en trois versions jusqu'à la version 3 complète du 20 avril.">
