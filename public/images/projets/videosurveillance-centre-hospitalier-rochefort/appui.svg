<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe d’une chaîne de dimensionnement en vidéosurveillance. À gauche, trois objectifs d’exploitation empilés du moins au plus exigeant, chacun converti en un seuil de densité de pixels sur le champ observé : comprendre les actions demande 60 pixels par mètre, reconnaître une personne 125, l’identifier formellement 250. En regard de chaque objectif, un témoin dessine un mètre de scène subdivisé à la densité exigée : douze intervalles pour le premier seuil, vingt-cinq pour le deuxième, cinquante pour le troisième — la densité se voit. À droite, quatre types de caméra dérivés de ces seuils, chacun relié par un trait à l’objectif qui le commande, et décrits par leur définition, leur focale et la portée de leur illuminateur infrarouge. Le seuil intermédiaire envoie deux branches : le même niveau de reconnaissance appelle deux optiques différentes selon que la scène est à cinq ou à vingt mètres. En bas, un chemin de retour part des quatre types, traverse toute la planche vers la gauche et remonte vers les objectifs : à la réception, chaque vue est vérifiée sur le seuil même qui a choisi sa caméra.">
