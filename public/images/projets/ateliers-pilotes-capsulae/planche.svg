<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe des utilités de procédé : quatre chaînes partent des productions centralisées du bâtiment — groupe froid à eau glycolée de 261 kW au régime 2/6 °C, air comprimé sec, eau chaude sanitaire avec adoucisseur pour le nettoyage en place, tableau général basse tension — et s’arrêtent toutes sur la limite du marché bâtiment, où des attentes sont laissées en limite de chaque atelier. Au-delà de cette limite se tiennent les trois ateliers pilotes — lit d’air fluidisé, spray drying, pilote R&amp;D — dont les équipements de production sont installés par un intégrateur extérieur, hors marché bâtiment.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
