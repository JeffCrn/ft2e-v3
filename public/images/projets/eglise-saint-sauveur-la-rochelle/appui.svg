<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la distribution électrique du clocher : depuis le tableau général existant de la sacristie, deux liaisons de 25 mm² montent par le comble de la nef jusqu’à deux tableaux divisionnaires implantés dans la salle des cloches — service et mise en valeur, 5 kVA, et mécanisme campanaire, 3 kVA, qui alimente cinq moteurs de volée et cinq de tintement, l’aval revenant au lot campanaire. La commande des sonneries monte aussi : programmable depuis la sacristie, synchronisée sur l’heure légale par une antenne ALS162. Chaque salle reçoit un départ d’éclairage, l’escalier un luminaire et un bloc de secours par volée, le clocher une alarme de type 4. En sens inverse, un paratonnerre à dispositif d’amorçage de niveau I, dépassant de 2 m le point le plus haut, redescend la foudre par deux conducteurs vers des prises de terre triangulées tenues sous les 10 ohms, reliées au tableau général par une liaison équipotentielle en cuivre nu de 25 mm² ; des parafoudres protègent le tableau général et les deux divisionnaires.">
