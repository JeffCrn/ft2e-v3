<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la réversibilité de la production de chaleur : la chaudière gaz à condensation de 40 kW, en service aujourd'hui, et le réseau de chaleur annoncé, à raccorder demain, convergent sur un même point de substitution qui alimente le réseau d'émission hydraulique du bâtiment — la production se remplace, les émetteurs ne bougent pas. En regard, le parti écarté : une pompe à chaleur à détente directe, dont les liaisons frigorigènes filent de la machine au bâtiment sans point de substitution et auraient figé le mode de production pour la durée de vie des machines.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
