  <path d="M 152.00 296.00 L 152.00 310.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.3"/>
  <path d="M 152.00 318.00 L 147.50 309.00 L 156.50 309.00 Z" class="c-encre" fill="#00393A"/>
  <text x="170.00" y="317.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">COMMUNS ET PARKING</text>
</svg>
