<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe des deux champs photovoltaïques d’un parc de bureaux et d’ateliers. À gauche, le champ des ateliers : 1 104 panneaux de 330 watts-crête, soit 364 kilowatts-crête, dont la production passe par cinq groupes d’onduleurs — deux de 80 kilovoltampères, puis 60, 55 et 40 — totalisant 315 kilovoltampères, avant de rejoindre une logette de comptage en limite de propriété équipée d’un disjoncteur de branchement de 400 ampères. La barre du point de livraison y est plus courte que la somme des départs, parce que l’injection sur le réseau public est plafonnée à 250 kilovoltampères et que le cahier des charges prescrit le bridage correspondant. À droite, à la même échelle, le champ des bureaux : 240 panneaux de 300 watts-crête, soit 72 kilowatts-crête — cinq fois moins —, distribués sur trois onduleurs de 25 kilovoltampères, un par immeuble, qui se raccordent au tableau général des services généraux. Les deux chaînes ne se rejoignent jamais, et leurs flèches de sortie pointent en sens inverses : l’énergie des ateliers quitte la parcelle, celle des bureaux y reste.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
  .c-pivot { fill: var(--color-pivot, #336667); }
  .c-clair { fill: var(--color-clair, #99CCCD); }
  .c-voile { fill: var(--color-voile, #E1F4F4); }
  .c-papier { fill: var(--color-papier, #F7F9FA); }
  .c-calcaire { fill: var(--color-calcaire, #EDF0F2); }
  .c-filet-1 { fill: var(--color-filet-1, #00393A38); }
  .c-filet-2 { fill: var(--color-filet-2, #00393A29); }
  .c-filet-3 { fill: var(--color-filet-3, #00393A1F); }
  .s-filet-1 { stroke: var(--color-filet-1, #00393A38); }
  .s-encre { stroke: var(--color-encre, #00393A); }
  .t-sans { font-family: "Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif; }
  .t-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
