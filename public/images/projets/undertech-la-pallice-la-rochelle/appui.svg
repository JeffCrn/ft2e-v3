  <text x="140.00" y="66.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LES ATELIERS · REVENTE TOTALE</text>
  <rect x="140.00" y="80.00" width="340.00" height="28.00" class="c-clair s-filet-1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <text x="132.00" y="98.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">364 kWc</text>
  <rect x="140.00" y="126.00" width="340.00" height="10.00" class="c-encre" fill="#00393A"/>
  <text x="132.00" y="135.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">315 kVA</text>
  <rect x="140.00" y="142.00" width="269.84" height="10.00" class="c-encre" fill="#00393A"/>
  <text x="132.00" y="151.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">250 kVA</text>
