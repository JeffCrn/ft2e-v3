<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de l’autonomie des cinq locaux. Sous une enveloppe continue — combles isolés par 400 mm de laine de verre, murs en blocs doublés de 160 mm, plancher de terre-plein isolé par 100 mm sous chape — cinq cellules ne partagent aucun équipement. Chacune descend du réseau public son propre comptage, puis porte sa pompe à chaleur air-air en multisplit à trois cassettes, sa ventilation mécanique contrôlée simple flux et son ballon d’eau chaude électrique de 50 litres. Deux cellules se distinguent, et pas la même : celle destinée à la restauration est comptée en 36 kVA triphasé quand les quatre autres le sont en 9 kVA monophasé ; l’agence postale ajoute seule un répartiteur voix-données-images et une centrale anti-intrusion. Aucune liaison ne traverse les refends.">
