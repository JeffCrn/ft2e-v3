<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la mise en sécurité incendie d’une auberge de jeunesse : seize zones de détection réparties sur six niveaux — onze zones de détection automatique, qui distinguent les chambres, les autres locaux et les circulations, et cinq zones de déclencheurs manuels, une par niveau desservi — convergent vers un système de sécurité incendie de catégorie A, adressable point par point, à équipement d’alarme de type 1 et à unité de gestion d’alarme unique, implanté au local de brassage du rez-de-chaussée. En aval, la mise en sécurité ne connaît qu’une échelle : les seize zones commandent une zone d’alarme unique, le bâtiment entier, sans temporisation ; dix d’entre elles, toutes les détections automatiques hors combles, commandent une zone de compartimentage unique, le bâtiment encore. Deux fonctions de sécurité restent hors du centralisateur : les exutoires des cages d’escalier, à commande manuelle sans raccordement au centralisateur, et les clapets coupe-feu du réseau de ventilation, autocommandés par fusible thermique. Le désenfumage des locaux est sans objet, aucun n’atteignant 300 m².">
