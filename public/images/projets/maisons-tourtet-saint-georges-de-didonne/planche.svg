<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la progression réglementaire d’une opération de logements : quatre calculs datés d’avril 2020 à octobre 2023 sont portés sur un même axe, gradué en écart au seuil du label. Le besoin bioclimatique, qui mesure l’enveloppe, reste à 52,7 pour un maximum de 67,2 aux quatre calculs — une ligne plate qui ne dépasse le seuil du label RT2012−20 % que de 1,58 point. La consommation d’énergie primaire, qui mesure les systèmes, descend par marches de 37,2 à 33,0 kWh/m²/an pour un maximum inchangé de 57,9, et s’éloigne du seuil jusqu’à 23,01 points ; la dernière marche, la plus haute, suit une opération arrêtée de mars 2021 à janvier 2023 et tient pour l’essentiel au passage des modules photovoltaïques de 285 à 375 Wc. L’enveloppe fixe la limite, les systèmes font la marge.">
