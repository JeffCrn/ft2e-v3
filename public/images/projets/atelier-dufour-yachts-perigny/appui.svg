<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la récupération de chaleur fatale : deux conduits d’air superposés ne se rencontrent jamais — en haut, l’air extrait du process passe sur une batterie de récupération avant d’être rejeté dehors ; en bas, les 38 000 m³/h d’air neuf imposés passent sur la seconde batterie, puis sur l’appoint gaz et la pompe à chaleur, avant d’être soufflés dans l’atelier. Une boucle d’eau glycolée, seule à traverser entre les deux conduits, reprend 146 045 kWh par an sur l’air extrait — le quart du besoin de chauffage.">
