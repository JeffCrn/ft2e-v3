<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de l’alimentation d’une passerelle mobile : le branchement existant de 12 kVA triphasé est conservé et alimente un coffret unique logé dans le banc, d’où partent cinq départs. Trois frontières sont franchies. La tension : deux départs d’éclairage traversent les blocs d’alimentation et passent en très basse tension 48 volts, 43 mètres de bandeau à leds sur la partie fixe et 28 mètres sur la partie mobile et sous le banc. Le joint mobile : 6,80 mètres de tablier coulissent sur les 25,40 mètres, et l’éclairage de cette partie les franchit par un enrouleur à rappel automatique chargé de 10 mètres de câble — la longueur de câble est cotée plus longue que la course. La limite du réseau public : la caméra de comptage devait être posée à 7 mètres sur un mât d’éclairage public existant et alimentée par le réseau, alimentation refusée ; un mât dédié de 5,00 mètres est repris sur le coffret de la passerelle.">
