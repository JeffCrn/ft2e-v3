<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Coupe de principe d’un atelier industriel. À gauche, hors du volume, une chaufferie de quatre chaudières à condensation de 145 kilowatts montées en cascade derrière une bouteille de découplage. Trois départs en sortent, tracés à l’échelle de leurs diamètres nominaux. Le plus gros, de diamètre nominal 80, alimente une batterie à eau chaude de 400 kilowatts logée dans une centrale de traitement d’air : celle-ci rend à l’atelier 40 mille mètres cubes par heure, diffusés sur toute la longueur du plafond par une gaine circulaire perforée, dont l’air descend vers les postes. Le deuxième, de diamètre nominal 50, alimente des panneaux rayonnants à eau suspendus sous cette gaine, en régime 65 sur 50, qui maintiennent 19 degrés dans les zones ateliers : leur chaleur descend sans aucun conduit et reste dans le volume. Le troisième, de diamètre nominal 33, le plus fin, quitte le dessin vers les vestiaires, le réfectoire et les sanitaires. En bas, au ras de trois postes de travail, des captations reprennent l’air chargé et le conduisent vers la droite, où il franchit une limite verticale marquée limite des marchés du bureau. Au-delà de cette limite, une ligne d’aspiration de 40 kilowatts, ouvrage du procédé, qui appartient au maître d’ouvrage et prend cet air en continu.">
