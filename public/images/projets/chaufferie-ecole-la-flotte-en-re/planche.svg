<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe en trois rangs. Chaque rang montre une épine continue, déjà construite à sa taille définitive, et les postes qu’elle dessert : les premiers sont tracés en trait plein, ils existent ; les suivants sont en trait interrompu, ils sont réservés. Premier rang, l’amont électrique : une logette de comptage de 250 kVA alimente un jeu de barres et quatre départs, dont deux raccordent les pompes à chaleur posées et deux restent en attente. Deuxième rang, la plateforme technique de 14 mètres sur 4 : son platelage est entier, et sur quatre alvéoles deux portent une machine, deux sont vides et portent au plan la mention « emplacement futur ». Troisième rang, le réseau enterré : un tronc pré-isolé court sur 120 mètres de tranchée et dessert trois destinations, dont une seule est raccordée — la sous-station de l’école maternelle ; les deux autres, l’école primaire et l’accueil de loisirs, s’arrêtent sur un regard de vannes construit, au-delà duquel le tracé devient interrompu. Un fourreau aiguillé, en trait fin interrompu, accompagne le tronc sur toute sa longueur. La même partition se répète aux trois rangs : deux sur quatre, deux sur quatre, une sur trois.">
