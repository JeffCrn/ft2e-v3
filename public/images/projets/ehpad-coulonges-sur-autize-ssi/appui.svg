<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la mise en sécurité par transfert horizontal en type J : un foyer détecté dans une chambre déclenche l’alarme sélective — audible du seul personnel, sans alarme sonore chez les résidents — et les asservissements de compartimentage, de désenfumage, de non-stop ascenseur et de déverrouillage. Les résidents passent derrière la paroi coupe-feu, au niveau même où ils se trouvent, plutôt que d’être évacués : l’étage est partagé en deux zones coupe-feu de façade à façade, desservies chacune par un ascenseur, avec deux chambres en espaces d’attente sécurisés ; au rez-de-chaussée, une unité protégée de douze chambres ; un escalier extérieur en bout d’aile donne aux secours un accès direct à l’étage.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
  .c-pivot { fill: var(--color-pivot, #336667); }
  .c-clair { fill: var(--color-clair, #99CCCD); }
  .c-voile { fill: var(--color-voile, #E1F4F4); }
  .c-papier { fill: var(--color-papier, #F7F9FA); }
  .c-calcaire { fill: var(--color-calcaire, #EDF0F2); }
