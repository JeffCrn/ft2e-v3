  <text x="1144.00" y="590.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">ESCALIER EXTÉRIEUR EN BOUT D’AILE · ACCÈS DIRECT DES SECOURS À L’ÉTAGE</text>
