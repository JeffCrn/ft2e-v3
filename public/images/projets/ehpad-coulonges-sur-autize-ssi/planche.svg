  <text x="128.00" y="472.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">AU NIVEAU MÊME OÙ ILS SE TROUVENT</text>
