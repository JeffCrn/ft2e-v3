  <text x="56.00" y="358.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LA MISE À L’ABRI · L’ÉTAGE, SOIXANTE LITS, EN DEUX ZONES COUPE-FEU DE FAÇADE À FAÇADE</text>
