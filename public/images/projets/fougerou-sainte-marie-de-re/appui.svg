<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe d’un parti technique décliné : dans la maison-type, une pompe à chaleur air/eau double service — fluide R32, COP de 4,65 à +7 °C — alimente des radiateurs à eau chaude en régime 50/45 °C et un ballon d’eau chaude sanitaire de 190 litres intégré ; une ventilation hygroréglable de type B à caisson individuel extrait l’air. Le même équipement se répète, à l’identique, dans les 54 maisons de l’opération, et les 27 calculs réglementaires RT2012 qui les couvrent concluent tous à la conformité, de 14 à 36 % sous l’exigence.">
