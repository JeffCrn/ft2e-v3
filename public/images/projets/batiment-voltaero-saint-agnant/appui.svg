<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe en trois registres. À gauche, la colonne des services : air traité, courants forts 220 V et données, air comprimé 6 bars, triphasé 380 V de charge. Au centre, le hall d’assemblage, les ateliers et la logistique. À droite, séparé par un mur plein, le plateau de bureaux, l’accueil et le local informatique. Premier rang, l’air traité : chaque côté a sa machine et ses gaines de soufflage, une machine de traitement thermodynamique pour 18 à 22 degrés Celsius dans le hall, une centrale de traitement d’air à groupes extérieurs pour 19 à 21 degrés Celsius dans les bureaux, plus un groupe dédié au local informatique. Deuxième rang, les courants forts et les données : dans le hall, six descentes régulières partent d’une ligne de plafond et s’arrêtent au-dessus du sol, au pas de 10 mètres du maillage ; dans les bureaux, cinq piquages montent au contraire du sol, en plinthe et au centre des marguerites de plateau ouvert. Troisième rang, l’air comprimé à 6 bars asséché et huilé : même maillage de plafond dans le hall, mais les descentes se terminent par une vanne sur un niveau d’attentes arrêté à 2,50 mètres ; côté bureaux, une croix — le programme y écrit sans objet. Quatrième rang, le triphasé de charge : c’est le seul service qui n’arrive pas du plafond mais du sol, en deux blocs pleins posés en bordure, 100 kilowatts près de la ligne d’assemblage et 100 kilowatts au local batterie, sur 300 kilowatts en continu au programme ; côté bureaux, une seconde croix. La colonne de droite s’interrompt ainsi à mi-hauteur, et c’est elle qui porte la démonstration.">
