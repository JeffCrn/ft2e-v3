  <text x="68.00" y="386.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LA MACHINE QUI REMPLACE</text>
  <path d="M 260.00 424.00 L 812.00 424.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
  <path d="M 260.00 556.00 L 772.00 556.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
  <text x="280.00" y="414.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">HAUTE TEMPÉRATURE · DÉPART  À 65 °C</text>
  <text x="280.00" y="444.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LE PLUS CHAUD QUE LA MACHINE FOURNIT</text>
  <text x="280.00" y="546.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">MACHINE STANDARD · RÉGIME D’EAU 35 °C</text>
  <text x="280.00" y="576.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LE RÉGIME DES POMPES À CHALEUR COURANTES</text>
  <rect x="600.00" y="401.00" width="168.00" height="46.00" class="c-papier s-filet-1" fill="#F7F9FA" stroke="#00393A38" stroke-width="1"/>
  <text x="612.00" y="419.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Isoler</text>
  <text x="612.00" y="437.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">RÉDUIRE LE BESOIN</text>
  <path d="M 560.00 424.00 L 560.00 276.00 L 740.00 276.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
  <path d="M 740.00 264.00 L 740.00 288.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="2.0"/>
  <text x="280.00" y="628.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LE TRAIT QUI S’ARRÊTE : LE RÉGIME N’ATTEINT PAS L’ÉMETTEUR</text>
  <path d="M 772.00 556.00 L 772.00 596.00 L 803.00 596.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.5"/>
