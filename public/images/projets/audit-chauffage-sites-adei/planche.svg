  <text x="824.00" y="265.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Aérotherme à eau chaude</text>
  <text x="824.00" y="285.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ATELIERS ET MAGASINS</text>
  <text x="824.00" y="302.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">SOUFFLAGE TROP FAIBLE À 35 °C</text>
  <text x="812.00" y="331.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">Déposer — L’ÉMETTEUR CHANGE</text>
  <rect x="812.00" y="387.00" width="332.00" height="74.00" class="c-papier s-filet-1" fill="#F7F9FA" stroke="#00393A38" stroke-width="1"/>
  <text x="824.00" y="413.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Radiateur à eau chaude</text>
  <text x="824.00" y="433.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">HÉBERGEMENTS, BUREAUX, SALLES</text>
  <text x="824.00" y="450.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ÉMISSION PLUS FAIBLE  À 65 °C</text>
  <text x="812.00" y="479.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">Isoler d’abord — LE BESOIN BAISSE, IL RESTE</text>
  <rect x="812.00" y="559.00" width="332.00" height="74.00" class="c-papier s-filet-1" fill="#F7F9FA" stroke="#00393A38" stroke-width="1"/>
  <text x="824.00" y="585.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Plancher chauffant</text>
  <text x="824.00" y="605.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">BUREAUX ET VESTIAIRES</text>
  <text x="824.00" y="622.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">CONÇU POUR LE BAS RÉGIME</text>
  <text x="812.00" y="651.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">Rien à changer — L’ÉMETTEUR SUIT LA MACHINE</text>
  <text x="56.00" y="688.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Le générateur ne se choisit pas seul : l’émetteur déjà posé décide de ce qu’on peut mettre en amont.</text>
