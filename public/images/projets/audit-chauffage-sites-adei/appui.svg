<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe du remplacement d’un générateur de chauffage sur un réseau existant. À gauche, une chaudière fioul ou gaz dessinée en trait interrompu — elle est déposée — surmonte le bloc de la pompe à chaleur qui la remplace. De ce bloc partent deux lignes horizontales, les deux régimes d’eau que la machine peut fournir : en haut le départ à 65 °C d’une pompe à chaleur haute température, en bas le régime d’eau de 35 °C d’une machine standard. À droite, trois familles d’émetteurs relevées sur les sites, placées chacune à la hauteur de ce qu’elle exige. L’aérotherme est au-dessus des deux lignes : le trait qui monte vers lui s’arrête avant de l’atteindre, car il est peu adapté aux régimes de pompe à chaleur, où sa température de soufflage devient trop faible — il faut le déposer. Le radiateur à eau chaude est sur la ligne des 65 °C, mais le trait y traverse d’abord une boîte intercalée, l’isolation : alimenté plus froid, il émet moins, et il ne reste en place qu’à condition que le besoin baisse. Le plancher chauffant est sous la ligne des 35 °C, largement atteint : conçu pour le bas régime, il ne demande rien. La démonstration tient dans les trois traits — un qui s’arrête, un qui passe sous condition, un qui atteint.">
