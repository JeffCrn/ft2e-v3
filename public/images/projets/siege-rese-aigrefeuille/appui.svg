<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la ventilation d'un bâtiment tertiaire restructuré : trois circuits d'air indépendants traversent une même enveloppe isolée par l'extérieur, et ce qui commande leur débit change d'un local à l'autre. Premier circuit, vestiaires et sanitaires : extraction mécanique permanente, le débit ne se décide nulle part. Deuxième circuit, bureaux : caisson d'extraction de 1 020 m³/h à moteurs à commutation électronique, régulation à pression constante — la commande naît dans le réseau. Troisième circuit, salle de réunion de trente places : centrale double flux de 540 m³/h pilotée par une sonde de CO2 posée dans le local, de sorte que l'occupation décide du débit. Son échangeur à contre-courant rend plus de 90 % de la chaleur à l'air neuf ; les deux autres circuits la laissent partir avec l'air rejeté.">
<style>
