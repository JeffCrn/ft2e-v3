<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de l’appariement des équipements par typologie : trois services à rendre dans chaque maison — chauffage, eau chaude sanitaire, ventilation — et deux machines par logement. Dans les sept T2, une pompe à chaleur air-air multisplit en chaud seul porte le chauffage, et le chauffe-eau thermodynamique porte à la fois l’eau chaude et la ventilation, son caisson d’extraction simple flux étant intégré au ballon. Dans les trois T3, une pompe à chaleur air-eau double service porte ensemble le chauffage et l’eau chaude par son ballon intégré, et la ventilation revient à un groupe hygroréglable indépendant.">
