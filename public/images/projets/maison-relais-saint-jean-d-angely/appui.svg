<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de l’individualisation des fluides : une chaufferie gaz à condensation en cascade et une distribution d’eau froide alimentent une colonne collective qui dessert 21 modules thermiques d’appartement — un par logement, sept T1, huit T1 bis et six T2. Le détail d’un logement montre les deux arrivées collectives et les trois services comptés au module — la chaleur vers les radiateurs et sèche-serviettes, l’eau chaude produite au module, l’eau froide — vers la salle d’eau, la kitchenette et la machine à laver.">
