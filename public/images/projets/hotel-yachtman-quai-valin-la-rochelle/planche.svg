<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la portée des deux missions : une coupe de sept niveaux à travers deux bâtiments accolés. La mission lots techniques est bornée à 230 m² — les services généraux du rez-de-chaussée et quatre chambres créées au premier étage — quand la coordination du système de sécurité incendie couvre l’établissement entier : un système unique de catégorie A, adressable, une détection généralisée jusqu’aux combles, une seule zone d’alarme sans temporisation.">
