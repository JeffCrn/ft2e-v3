<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe d’une chaufferie bois granulés en cascade et de sa distribution. À gauche, la pièce de réserve — granulés de bois, plans inclinés, vis d’extraction — alimente quatre chaudières identiques de 64 kW, 256 kW en tout : la régulation les enclenche à la demande, permute leurs priorités pour vider l’intégralité du silo et garde un secours. Leurs départs se rassemblent sur un collecteur vers un ballon tampon de 2 500 litres, qui découple la production. Du ballon, trois départs partent en réseau enterré pré-isolé, figuré en pointillé, vers trois sous-stations : le foyer existant, raccordé par échangeur à plaques, avec sa production d’eau chaude sanitaire ; l’extension, avec sa panoplie d’eau froide, d’eau chaude et de bouclage, qui dessert aussi l’atelier bois ; la maison de retraite, avec l’atelier sport. Chaque départ traverse un compteur d’énergie, figuré par un cercle, reporté sur l’automate de la chaufferie avec son historique mensuel.">
