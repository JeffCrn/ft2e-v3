  <text x="24.00" y="66.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ENVELOPPE CONSTRUITE</text>
  <text x="210.00" y="66.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">PÉRIMÈTRE DU CALCUL</text>
  <rect x="210.00" y="76.00" width="318.00" height="176.00" class="c-calcaire" fill="#EDF0F2"/>
