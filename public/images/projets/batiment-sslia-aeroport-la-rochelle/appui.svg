<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Coupe de principe. Une enveloppe construite d’un seul tenant est partagée par un mur en deux parties. À gauche, la remise des véhicules, un seul volume de 185 mètres carrés, tenue sous 12 degrés : elle reste hors du périmètre du calcul thermique. À droite, deux niveaux superposés, l’étage lu comme du logement collectif et le rez-de-chaussée comme des bureaux, avec deux exigences de perméabilité à l’air différentes, 1,00 puis 1,7 mètre cube par heure et par mètre carré sous 4 pascals. Un trait épais ferme ces deux niveaux seuls : c’est le périmètre calculé, et il n’épouse la façade que sur trois côtés. Sur le quatrième, il quitte l’enveloppe et descend le long du mur intérieur, qui reçoit alors la composition d’une façade — 120 millimètres d’isolant, résistance supérieure à 3,75, coefficient de transmission plafonné à 0,249. La porte qui le franchit reçoit le coefficient d’une menuiserie extérieure, 2,00, et le plancher intermédiaire un coefficient de réduction de pont thermique de 0,40, calculé pour un local à 10 degrés. Sous la coupe, deux barres de largeur proportionnelle à la puissance absorbée en chauffage : la remise reçoit sa propre machine, 1,5 kilowatt pour le seul hors gel, contre 6,7 kilowatts pour les deux niveaux calculés.">
<style>
