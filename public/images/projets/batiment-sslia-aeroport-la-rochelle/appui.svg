  <text x="34.00" y="104.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">REMISE · 185 m²</text>
  <text x="34.00" y="122.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">HORS DU CALCUL</text>
  <text x="34.00" y="140.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">&lt; 12 °C</text>
  <text x="518.00" y="104.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">ÉTAGE — LOGEMENT COLLECTIF</text>
  <text x="518.00" y="208.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">REZ-DE-CHAUSSÉE — BUREAUX</text>
  <text x="24.00" y="300.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LE MUR INTÉRIEUR EST ISOLÉ COMME UNE FAÇADE</text>
  <text x="24.00" y="330.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LA LIMITE DU CALCUL PASSE À L’INTÉRIEUR DU BÂTIMENT</text>
</svg>
