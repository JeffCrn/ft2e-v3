  <text x="418.00" y="634.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">HORS GEL SEUL · COP 4,00</text>
  <rect x="718.00" y="570.00" width="268.00" height="28.00" class="c-clair s-filet-1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <text x="852.00" y="618.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">6,7 kW ABSORBÉS</text>
  <text x="852.00" y="634.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">CHAUFFAGE ET RAFRAÎCHISSEMENT · COP 5,00</text>
  <text x="56.00" y="688.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Le périmètre du calcul thermique est plus petit que le bâtiment : la limite passe à l’intérieur, le long d’un mur.</text>
  <rect x="56.00" y="714.00" width="364.00" height="30.00" class="c-profond" fill="#001718"/>
  <text x="76.00" y="734.00" class="t-mono c-voile" fill="#E1F4F4" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" letter-spacing="1.54">LA ROCHELLE · 316 m² AU CALCUL RT · 2022</text>
</svg>
