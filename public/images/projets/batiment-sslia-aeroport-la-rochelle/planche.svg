  <text x="582.00" y="484.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LE COEFFICIENT D’UNE MENUISERIE EXTÉRIEURE</text>
  <path d="M 568.00 464.00 L 576.00 464.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.4"/>
