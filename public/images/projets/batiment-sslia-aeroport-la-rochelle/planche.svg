  <text x="296.00" y="276.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">REMISE DES VÉHICULES · 185 m²</text>
  <text x="296.00" y="294.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">HORS DU PÉRIMÈTRE DE CALCUL</text>
  <text x="296.00" y="312.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">CONSIGNE DE CHAUFFAGE &lt; 12 °C</text>
  <text x="296.00" y="410.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">AUCUN USAGE AU SENS DU CALCUL</text>
  <text x="1124.00" y="276.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">ÉTAGE — LOGEMENT COLLECTIF</text>
  <text x="1124.00" y="294.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">PERMÉABILITÉ À L’AIR 1,00 m³/(h·m²) SOUS 4 Pa</text>
  <text x="1124.00" y="424.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">REZ-DE-CHAUSSÉE — BUREAUX</text>
  <text x="1124.00" y="442.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">PERMÉABILITÉ À L’AIR 1,7 m³/(h·m²) SOUS 4 Pa</text>
  <text x="582.00" y="326.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">MUR INTÉRIEUR · ISOLANT 120 mm · R ≥ 3,75 · Up ≤ 0,249</text>
  <text x="582.00" y="342.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LA COMPOSITION DE LA FAÇADE, SUR UNE PAROI INTÉRIEURE</text>
  <path d="M 564.00 322.00 L 576.00 322.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.4"/>
  <text x="582.00" y="366.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">PLANCHER INTERMÉDIAIRE · PONT THERMIQUE RÉDUIT, b = 0,40</text>
  <text x="582.00" y="382.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">COEFFICIENT CALCULÉ POUR UN LOCAL À 10 °C</text>
  <path d="M 576.00 362.00 L 572.00 362.00 L 572.00 396.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.4"/>
