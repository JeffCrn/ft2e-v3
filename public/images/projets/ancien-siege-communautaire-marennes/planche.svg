<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Coupe de principe de la rénovation thermique par éléments : une enveloppe isolante continue referme le bâtiment — isolation par l’extérieur à R ≥ 4,15 m²·K/W qui enveloppe le pont thermique du plancher intermédiaire, toiture en deux couches de 220 et 280 mm sous 0,073 W/(m²·K), menuiseries aluminium à 1,30 W/(m²·K) au plus avec 28 brise-soleil orientables. La seule traversée d’air est maîtrisée : une centrale double flux en combles échange 2 550 m³/h à plus de 80 % d’efficacité. Au-dessus, 108 modules photovoltaïques de 33,48 kWc en surimposition sur les deux pans alimentent deux onduleurs de 15 kVA et repartent au réseau en revente totale sur un comptage triphasé de 36 kVA.">
