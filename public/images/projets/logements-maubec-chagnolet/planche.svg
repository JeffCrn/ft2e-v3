<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la partition réglementaire du chauffage : treize logements en trois bâtiments sur un même site, séparés par une frontière réglementaire invisible sur le plan de masse. Côté logements collectifs, les bâtiments A et B reçoivent dix chaudières gaz à condensation individuelles sous des plafonds d’Ic énergie de 632,6 et 650,3 kilogrammes d’équivalent CO₂ par mètre carré ; côté maisons individuelles ou accolées, le bâtiment C passe en pompe à chaleur air-eau et en tout-électrique sous un plafond trois fois plus sévère, 206,5. Les trois pistes, dessinées à la même échelle, montrent chaque résultat sous son plafond — 474,2, 519,2 et 76,4 — et les résultats du gaz au-delà du plafond des maisons accolées.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
  .c-pivot { fill: var(--color-pivot, #336667); }
  .c-clair { fill: var(--color-clair, #99CCCD); }
  .c-voile { fill: var(--color-voile, #E1F4F4); }
  .c-papier { fill: var(--color-papier, #F7F9FA); }
  .c-calcaire { fill: var(--color-calcaire, #EDF0F2); }
  .c-filet-1 { fill: var(--color-filet-1, #00393A38); }
  .c-filet-2 { fill: var(--color-filet-2, #00393A29); }
  .c-filet-3 { fill: var(--color-filet-3, #00393A1F); }
  .s-filet1 { stroke: var(--color-filet-1, #00393A38); }
  .s-encre { stroke: var(--color-encre, #00393A); }
  .t-sans { font-family: "Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif; }
  .t-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
