  <text x="56.00" y="235.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">42 PERSONNES</text>
  <text x="56.00" y="248.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">PLUS DE LA MOITIÉ</text>
  <text x="56.00" y="261.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">EN CHALEUR LATENTE</text>
  <text x="56.00" y="390.32" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Ordinateurs</text>
  <text x="336.00" y="390.32" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">1 260 W</text>
  <text x="56.00" y="448.18" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Éclairage</text>
  <text x="336.00" y="448.18" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">992 W</text>
  <text x="56.00" y="465.18" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">FLUORESCENT EN FAUX PLAFOND</text>
  <text x="56.00" y="498.83" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Renouvellement d’air</text>
  <text x="336.00" y="498.83" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">445 W</text>
  <text x="56.00" y="515.83" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">720 m³/h</text>
  <text x="56.00" y="534.79" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Vidéoprojecteur, baie de</text>
  <text x="56.00" y="551.79" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">brassage</text>
  <text x="336.00" y="534.79" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">200 W</text>
  <text x="56.00" y="580.17" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Mur et baie</text>
  <text x="336.00" y="580.17" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">217 W</text>
  <text x="56.00" y="597.17" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">MUR : 0,354 W/(m²·K)</text>
  <rect x="906.00" y="254.00" width="9.00" height="226.17" class="c-encre" fill="#00393A"/>
  <text x="925.00" y="365.08" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Intérieur</text>
  <text x="925.00" y="383.08" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" font-variant-numeric="tabular-nums">8 414 W</text>
  <rect x="906.00" y="568.17" width="9.00" height="5.83" class="c-encre" fill="#00393A"/>
  <text x="925.00" y="569.08" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Enveloppe</text>
  <text x="925.00" y="587.08" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" font-variant-numeric="tabular-nums">217 W</text>
  <rect x="56.00" y="620.17" width="1088.00" height="1.00" class="c-filet-3" fill="#00393A1F"/>
  <text x="56.00" y="638.17" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">CINQ POSTES D’ORIGINE INTERNE : 8 416 W · POSTE DE DÉBIT COMPLÉMENTAIRE : −2 W</text>
  <text x="56.00" y="688.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">La climatisation ne combat pas le climat — elle évacue ce que produisent les occupants et leurs équipements.</text>
