  <path d="M 366.00 522.79 C 636.00 522.79, 636.00 474.79, 906.00 474.79 L 906.00 480.17 C 636.00 480.17, 636.00 528.17, 366.00 528.17 Z" class="c-clair s-filet1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <path d="M 366.00 568.17 C 636.00 568.17, 636.00 568.17, 906.00 568.17 L 906.00 574.00 C 636.00 574.00, 636.00 574.00, 366.00 574.00 Z" class="c-pivot s-filet1" fill="#336667" stroke="#00393A38" stroke-width="1"/>
