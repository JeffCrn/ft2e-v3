<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe d’une autoconsommation collective. À gauche, deux origines : la toiture du pôle commercial, qui produit 41 178 kilowattheures par an dans le scénario de l’étude de faisabilité, et le réseau public. La production se partage en deux rubans : 23 190 kilowattheures — 56 % de la production — rejoignent les deux bâtiments communaux, le groupe scolaire avec sa salle polyvalente et la salle multi-fonctions, qui consomment ensemble 96 494 kilowattheures par an ; 17 988 kilowattheures partent en surplus vendu. Le solde des besoins, 73 304 kilowattheures, reste soutiré au réseau. Tous les flux traversent le réseau public de distribution, dans une boucle d’autoconsommation collective de 700 mètres.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
  .c-pivot { fill: var(--color-pivot, #336667); }
  .c-clair { fill: var(--color-clair, #99CCCD); }
  .c-voile { fill: var(--color-voile, #E1F4F4); }
  .c-papier { fill: var(--color-papier, #F7F9FA); }
  .c-calcaire { fill: var(--color-calcaire, #EDF0F2); }
  .c-filet-1 { fill: var(--color-filet-1, #00393A38); }
  .c-filet-2 { fill: var(--color-filet-2, #00393A29); }
  .c-filet-3 { fill: var(--color-filet-3, #00393A1F); }
  .s-filet-1 { stroke: var(--color-filet-1, #00393A38); }
  .t-sans { font-family: "Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif; }
  .t-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
  <rect x="0.00" y="0.00" width="552.00" height="368.00" class="c-papier" fill="#F7F9FA"/>
  <text x="24.00" y="34.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" letter-spacing="1.54">LA TOITURE PARTAGÉE</text>
  <path d="M 196.00 66.00 C 294.00 66.00, 294.00 66.00, 392.00 66.00 L 392.00 97.43 C 294.00 97.43, 294.00 97.43, 196.00 97.43 Z" class="c-clair s-filet1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <path d="M 196.00 97.43 C 294.00 97.43, 294.00 121.43, 392.00 121.43 L 392.00 161.94 C 294.00 161.94, 294.00 137.94, 196.00 137.94 Z" class="c-clair s-filet1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <path d="M 196.00 161.94 C 294.00 161.94, 294.00 161.94, 392.00 161.94 L 392.00 290.00 C 294.00 290.00, 294.00 290.00, 196.00 290.00 Z" class="c-calcaire s-filet1" fill="#EDF0F2" stroke="#00393A38" stroke-width="1"/>
  <rect x="188.00" y="66.00" width="8.00" height="71.94" class="c-encre" fill="#00393A"/>
