  <rect x="392.00" y="66.00" width="8.00" height="31.43" class="c-encre" fill="#00393A"/>
  <rect x="392.00" y="121.43" width="8.00" height="168.57" class="c-encre" fill="#00393A"/>
  <text x="180.00" y="99.97" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="13" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600" text-anchor="end">Toiture du pôle</text>
  <text x="180.00" y="115.97" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">41 178 kWh/an</text>
  <text x="180.00" y="223.97" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="13" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600" text-anchor="end">Réseau public</text>
  <text x="180.00" y="239.97" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">73 304 kWh/an</text>
  <text x="408.00" y="79.71" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="13" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Surplus vendu</text>
  <text x="408.00" y="95.71" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" font-variant-numeric="tabular-nums">17 988 kWh/an</text>
  <text x="408.00" y="203.71" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="13" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">École et salles</text>
  <text x="408.00" y="219.71" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" font-variant-numeric="tabular-nums">96 494 kWh/an</text>
  <text x="294.00" y="133.18" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">56 % PARTAGÉS</text>
</svg>
