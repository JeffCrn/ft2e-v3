<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe d’une autoconsommation collective. À gauche, deux origines : la toiture du pôle commercial, qui produit 41 178 kilowattheures par an dans le scénario de l’étude de faisabilité, et le réseau public. La production se partage en deux rubans : 23 190 kilowattheures — 56 % de la production — rejoignent les deux bâtiments communaux, le groupe scolaire avec sa salle polyvalente et la salle multi-fonctions, qui consomment ensemble 96 494 kilowattheures par an ; 17 988 kilowattheures partent en surplus vendu. Le solde des besoins, 73 304 kilowattheures, reste soutiré au réseau. Tous les flux traversent le réseau public de distribution, dans une boucle d’autoconsommation collective de 700 mètres.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
  .c-encre { fill: var(--color-encre, #00393A); }
  .c-pivot { fill: var(--color-pivot, #336667); }
  .c-clair { fill: var(--color-clair, #99CCCD); }
  .c-voile { fill: var(--color-voile, #E1F4F4); }
  .c-papier { fill: var(--color-papier, #F7F9FA); }
  .c-calcaire { fill: var(--color-calcaire, #EDF0F2); }
  .c-filet-1 { fill: var(--color-filet-1, #00393A38); }
  .c-filet-2 { fill: var(--color-filet-2, #00393A29); }
  .c-filet-3 { fill: var(--color-filet-3, #00393A1F); }
  .s-filet1 { stroke: var(--color-filet-1, #00393A38); }
  .t-sans { font-family: "Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif; }
  .t-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
  <rect x="0.00" y="0.00" width="1200.00" height="800.00" class="c-papier" fill="#F7F9FA"/>
  <text x="56.00" y="76.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" letter-spacing="1.54">SCHÉMA DE PRINCIPE · AUTOCONSOMMATION COLLECTIVE</text>
  <text x="56.00" y="112.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="30" font-weight="700" font-variation-settings="'wdth' 112, 'wght' 700">Pôle commercial de Fors</text>
  <text x="56.00" y="138.00" class="t-sans c-pivot" fill="#336667" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="16" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">La toiture des commerces alimente l’école et les salles communales</text>
  <rect x="56.00" y="160.00" width="1088.00" height="1.00" class="c-filet-1" fill="#00393A38"/>
  <text x="56.00" y="190.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">L’ANNÉE D’ÉNERGIE DE L’ÉTUDE DE FAISABILITÉ · SCÉNARIO RETENU DE 36 kWc EN TOITURE</text>
  <path d="M 375.00 232.00 C 640.50 232.00, 640.50 232.00, 906.00 232.00 L 906.00 282.28 C 640.50 282.28, 640.50 282.28, 375.00 282.28 Z" class="c-clair s-filet1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <path d="M 375.00 282.28 C 640.50 282.28, 640.50 322.28, 906.00 322.28 L 906.00 387.10 C 640.50 387.10, 640.50 347.10, 375.00 347.10 Z" class="c-clair s-filet1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <path d="M 375.00 387.10 C 640.50 387.10, 640.50 387.10, 906.00 387.10 L 906.00 592.00 C 640.50 592.00, 640.50 592.00, 375.00 592.00 Z" class="c-calcaire s-filet1" fill="#EDF0F2" stroke="#00393A38" stroke-width="1"/>
  <rect x="366.00" y="232.00" width="9.00" height="115.10" class="c-encre" fill="#00393A"/>
  <rect x="366.00" y="387.10" width="9.00" height="204.90" class="c-encre" fill="#00393A"/>
  <rect x="906.00" y="232.00" width="9.00" height="50.28" class="c-encre" fill="#00393A"/>
  <rect x="906.00" y="322.28" width="9.00" height="269.72" class="c-encre" fill="#00393A"/>
  <text x="640.50" y="260.64" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">LE SURPLUS VENDU · 17 988 kWh/an</text>
  <text x="640.50" y="338.19" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">23 190 kWh/an · 56 % DE LA PRODUCTION</text>
  <text x="640.50" y="493.05" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="middle">SOUTIRÉS AU RÉSEAU · 73 304 kWh/an</text>
  <text x="56.00" y="280.05" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">La toiture du pôle</text>
  <text x="336.00" y="280.05" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">41 178 kWh/an</text>
  <text x="56.00" y="297.05" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">PRODUCTION DE LA PREMIÈRE ANNÉE</text>
  <text x="56.00" y="310.05" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">CENTRALE DE 36 kWc À L’ÉTUDE</text>
  <text x="56.00" y="486.55" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Le réseau public</text>
  <text x="336.00" y="486.55" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" text-anchor="end" font-variant-numeric="tabular-nums">73 304 kWh/an</text>
  <text x="56.00" y="503.55" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LE SOLDE DES BESOINS DES BÂTIMENTS</text>
  <text x="925.00" y="255.14" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">La revente du surplus</text>
  <text x="925.00" y="273.14" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" font-variant-numeric="tabular-nums">17 988 kWh/an</text>
  <text x="925.00" y="455.14" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Deux bâtiments communaux</text>
  <text x="925.00" y="473.14" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="12" font-weight="500" font-variant-numeric="tabular-nums">96 494 kWh/an</text>
  <text x="925.00" y="489.14" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">GROUPE SCOLAIRE,</text>
  <text x="925.00" y="502.14" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">SALLE POLYVALENTE,</text>
  <text x="925.00" y="515.14" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">SALLE MULTI-FONCTIONS</text>
  <text x="925.00" y="528.14" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">UN QUART DES BESOINS</text>
  <text x="925.00" y="541.14" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">COUVERT PAR LA TOITURE</text>
  <rect x="56.00" y="604.00" width="1088.00" height="1.00" class="c-filet-3" fill="#00393A1F"/>
  <text x="56.00" y="622.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">LES FLUX TRAVERSENT LE RÉSEAU PUBLIC DE DISTRIBUTION · BOUCLE D’AUTOCONSOMMATION COLLECTIVE DE 700 m</text>
  <text x="56.00" y="688.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">La toiture du commerce de Fors est dessinée pour éclairer aussi son école.</text>
  <rect x="56.00" y="714.00" width="201.00" height="30.00" class="c-profond" fill="#001718"/>
  <text x="76.00" y="734.00" class="t-mono c-voile" fill="#E1F4F4" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="11" font-weight="500" letter-spacing="1.54">FORS · 768 m² · 2025</text>
</svg>
