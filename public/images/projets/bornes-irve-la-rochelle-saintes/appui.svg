<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de la recharge de sept véhicules de service sur deux sites. À gauche, le besoin : chaque véhicule parcourt au plus 500 kilomètres par semaine, à 20 kilowattheures aux 100 kilomètres, et stationne 14 heures par nuit, cinq nuits par semaine ; deux jauges posent la puissance utile sous la capacité d’une borne de 7 kilowatts — 5,7 kilowatts pour les quatre véhicules de La Rochelle, soit 400 kilowattheures par semaine sur 70 heures de charge, et 4,3 kilowatts pour les trois véhicules de Saintes, soit 300 kilowattheures. À droite, la distribution prescrite par le lot : depuis le tableau général existant, derrière un disjoncteur différentiel 4 fois 63 ampères sélectif, une alimentation de 22 kilowatts tétrapolaire descend vers le tableau divisionnaire IRVE — interrupteur général 80 ampères, arrêt d’urgence, parafoudre — d’où partent trois phases : la première, protégée par un disjoncteur 2 fois 40 ampères à différentiel 30 milliampères immunisé, alimente une borne mutualisée de 7 kilowatts qui dessert quatre points de charge à prise T2S sur potelet, avec un lecteur de badge déporté ; les deux autres sont réservées à deux bornes identiques, soit douze véhicules au total sans modification du raccordement. Le même tableau équipe les deux sites ; à Saintes, trois points de charge sont raccordés et un quatrième reste disponible.">
