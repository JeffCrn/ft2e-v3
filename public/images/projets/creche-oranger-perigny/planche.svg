<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe électrique de l’extension : en toiture, 48 modules photovoltaïques totalisant 17,5 kilowatts-crête alimentent la distribution du bâtiment en autoconsommation, le surplus étant revendu au réseau et l’appoint soutiré au même point ; parmi les départs, une pompe à chaleur air/eau de 7,5 kilowatts porte chaque kilowattheure électrique à 4,6 kilowattheures de chaleur (COP 4,60), le complément étant pris à l’air extérieur, et cette chaleur est diffusée au sol par un plancher chauffant à très basse température, au régime 30/35 degrés.">
