  <text x="912.00" y="374.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">POMPE À CHALEUR</text>
  <text x="912.00" y="388.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">À DÉTENTE DIRECTE</text>
  <text x="912.00" y="402.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">BLOQUÉE EN CHAUD SEUL</text>
  <text x="912.00" y="416.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">POUR LA CONFORMITÉ RT2012</text>
  <text x="912.00" y="430.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">CASSETTES EN FAUX PLAFOND</text>
  <text x="1130.00" y="536.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end" font-variant-numeric="tabular-nums">152,16 m² · SURFACE UTILE</text>
