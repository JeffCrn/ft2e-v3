<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe du partage réglementaire : quatorze studios de plain-pied et un espace commun sous une même enveloppe, montée d’un seul tenant. La limite des deux calculs ne correspond à aucun mur ; elle commande pourtant l’étanchéité à l’air de la même paroi — tenue à 0,8 m³/(h·m²) sous 4 Pa et prouvée par une mesure côté logements (RE2020), laissée à la valeur par défaut de 1,7 sans test côté espace commun (RT2012) — et le parti des machines : quatorze productions individuelles de chauffage et d’eau chaude d’un côté, une production collective de l’autre. La même limite commande l’incendie : détecteurs avertisseurs autonomes de fumée aux logements, équipement d’alarme de type 4 à l’espace commun classé établissement recevant du public.">
<style>
  .c-profond { fill: var(--color-profond, #001718); }
