  <path d="M 1140.00 561.00 L 1140.00 576.00" fill="none" class="s-encre" stroke="#00393A" stroke-width="1.0"/>
  <text x="1144.00" y="588.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">VALEUR PAR DÉFAUT 1,7 — SANS TEST</text>
  <text x="56.00" y="624.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">UNE TROISIÈME RÈGLE SUIT LA MÊME LIMITE — AUX LOGEMENTS, LE DÉTECTEUR AVERTISSEUR AUTONOME DE FUMÉE (DAAF)</text>
  <text x="56.00" y="640.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">À L’ESPACE COMMUN, CLASSÉ ERP DE TYPE L EN CINQUIÈME CATÉGORIE, L’ÉQUIPEMENT D’ALARME DE TYPE 4</text>
  <text x="56.00" y="688.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">Une enveloppe continue, deux calculs, deux jeux d’indicateurs qui ne se recouvrent pas.</text>
