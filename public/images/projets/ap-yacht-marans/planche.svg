<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe de deux zones de calcul thermique réglementaire sous un même permis. Deux colonnes, une par zone : à gauche la zone restauration et vestiaires, 854 mètres carrés de surface RT ; à droite le hall de production, 1 318 mètres carrés. Chaque colonne s’appuie sur un mur vertical au trait double, qui figure le plafond réglementaire, et chaque barre horizontale mesure la marge restante avant ce plafond, jamais la valeur atteinte. Premier registre, les deux exigences d’énergie, en pourcentage du plafond : côté restauration et vestiaires, le besoin bioclimatique ne laisse que 0,28 pour cent, soit un moignon de barre collé au mur, quand la consommation conventionnelle en garde 24,63 ; côté hall, le besoin bioclimatique garde 5,2 pour cent et la consommation 54,6, la plus longue barre du dessin. Second registre, la température intérieure conventionnelle, en degrés : la zone restauration et vestiaires garde 1,8 degré avant son plafond, le hall n’en garde aucun et sa barre est réduite à une marque posée sur le mur. Les deux serrages tombent ainsi dans des registres différents et dans des colonnes différentes.">
<style>
