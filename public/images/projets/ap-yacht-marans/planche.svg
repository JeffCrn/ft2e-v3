  <text x="56.00" y="218.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="600" font-variation-settings="'wdth' 112, 'wght' 600">Restauration et vestiaires</text>
