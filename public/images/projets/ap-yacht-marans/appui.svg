  <text x="24.00" y="96.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">REGISTRE 1 · LES DEUX EXIGENCES D’ÉNERGIE — MARGE EN % DU PLAFOND</text>
  <text x="24.00" y="212.00" class="t-mono c-encre" fill="#00393A" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">REGISTRE 2 · LA TEMPÉRATURE INTÉRIEURE CONVENTIONNELLE — MARGE EN °C</text>
