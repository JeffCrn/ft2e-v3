<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Coupe de principe, avant et après, de la reprise de la ventilation de soixante maisons individuelles à toiture-terrasse. Avant, d’après le relevé du diagnostic de janvier 2023 : l’extracteur est enfermé dans un coffre à l’étage, des gaines souples des années 2000 raccordent la salle de bains et les WC sur le seul piquage de la cuisine — 25 mètres cubes par heure mesurés en cuisine pour 30 à 90 réglementaires —, le rejet se fait en façade et les entrées d’air sont obturées. Après, d’après le dossier de consultation d’octobre 2023 : le caisson d’extraction à moteur à commutation électronique est posé sur la toiture-terrasse, sur des dallettes et un matériau résilient, avec un arrêt cadenassable ; un réseau rigide en acier galvanisé calorifugé monte à travers la dalle par un carottage fourreauté, étanché à la résine et au bitume armé, et couvert d’une bavette ; chaque bouche — cuisine, salle de bains, WC — a son propre piquage, tenu entre 80 et 160 pascals ; le rejet se fait par un sifflet grillagé au-dessus du toit ; les entrées d’air sont vérifiées et les réseaux redescendent dans des coffres peints. En bas, quatre gabarits de largeur proportionnelle donnent le débit du caisson de chaque typologie : huit T2 à 120 mètres cubes par heure, huit T3 à 150, vingt-huit T4 à 165, seize T6 à 195 — soixante maisons. L’extraction quitte le logement : un caisson par toiture, un piquage par bouche, un débit par typologie.">
