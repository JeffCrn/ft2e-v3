  <text x="458.05" y="198.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">LA BANDE AUTORISÉE : DE 90 À 0</text>
