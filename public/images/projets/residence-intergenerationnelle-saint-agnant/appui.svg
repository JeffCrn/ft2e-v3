  <rect x="470.05" y="96.00" width="57.95" height="28.00" class="c-clair s-filet-1" fill="#99CCCD" stroke="#00393A38" stroke-width="1"/>
  <text x="34.00" y="114.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40">ZONE 1 · 21 LOGEMENTS · 769,74 m² HABITABLES</text>
  <text x="528.00" y="140.00" class="t-mono c-pivot" fill="#336667" font-family='"IBM Plex Mono", ui-monospace, monospace' font-size="10" font-weight="500" letter-spacing="1.40" text-anchor="end">ZONE 2 · ESPACE COMMUN · 100 m²</text>
