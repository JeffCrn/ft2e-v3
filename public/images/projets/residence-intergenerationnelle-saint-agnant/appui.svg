  <text x="24.00" y="320.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="30" font-weight="700" font-variation-settings="'wdth' 118, 'wght' 700" font-variant-numeric="tabular-nums">−221,8</text>
  <text x="139.28" y="320.00" class="t-sans c-encre" fill="#00393A" font-family='"Archivo Variable", Archivo, "Helvetica Neue", Arial, sans-serif' font-size="14" font-weight="400" font-variation-settings="'wdth' 100, 'wght' 400">kWhep/m²/an</text>
