<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Schéma de principe d’une opération de seize logements aux productions d’énergie individuelles. À gauche, la barre des typologies : onze T3, deux T2, un T4 et deux T1. Trois rubans, larges comme leur compte de logements, les affectent à trois familles de production : treize logements — les T2 et les T3 — à une chaudière murale gaz à condensation individuelle de 18,5 kilowatts, le gaz compté par logement en gaine palière ; le T4 à une pompe à chaleur air-eau double service avec ballon de 190 litres ; les deux T1 à l’électricité directe avec chauffe-eau thermodynamique de 100 litres sur air extérieur. En dessous, un second registre montre la toiture : huit modules photovoltaïques de 375 watts-crête — 3 000 watts-crête en tout —, chacun muni de son micro-onduleur, alimentent en autoconsommation l’électricité des logements de l’étage, un coffret par logement en gaine technique. Aucune chaufferie commune : l’énergie se produit et se compte logement par logement.">
<style>
