<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Coupe de principe de l’évacuation des chaudières individuelles de la résidence : chaque logement porte une chaudière gaz à condensation étanche à micro-accumulation. En gaine technique, les chaudières de quatre niveaux se piquent sur un conduit collectif 3CEp — un conduit concentrique unique où les fumées montent par le cœur pendant que l’air de combustion descend par la couronne, jusqu’au débouché en toiture ; chaque piquage porte un clapet anti-retour, un té de purge en pied renvoie les condensats à la colonne d’eaux usées, et chaque conduit est éprouvé au test de fumée avant la fermeture des gaines. En façade ou en toiture, la ventouse individuelle réunit l’air et les fumées dans un terminal concentrique. Trois tailles de chaudières servent 12, 14 ou 16 litres par minute à ΔT 30 K, selon la surface et le nombre de salles de bains.">
