<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 368" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%;height:auto;display:block" aria-label="Coupe de principe de l’enveloppe : trois niveaux de bureaux empilés sur une parcelle étroite que le bâtiment enjambe — le plancher du premier étage passe au-dessus d’un passage voiture et se traite comme un plancher sur l’extérieur. L’isolation ferme chaque face : 180 mm d’isolant intérieur sur les murs, 140 mm de polyuréthane au dernier étage, 200 mm en toiture-terrasse, 480 mm de laine de verre sous les combles, rupteurs de ponts thermiques à chaque plancher intermédiaire et cage d’ascenseur isolée jusqu’à sa fosse.">
