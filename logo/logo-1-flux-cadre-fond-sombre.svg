<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 90" role="img" aria-label="FT2E — Bureau d'études techniques">
  <!-- Concept 1 · Le flux dans le cadre
       Le bâtiment (cadre) est traversé par un flux continu (réseaux CVC/élec).
       Le cadre s'ouvre pour laisser passer le flux : l'ingénierie rend le bâtiment perméable à l'énergie. -->
  <defs>
    <style>
      .ink { stroke:#EDF1F5; }
      .cu  { stroke:#D98A55; }
      .s   { fill:none; stroke-width:7; }
    </style>
  </defs>

  <!-- Pictogramme (80×80) -->
  <g transform="translate(5,5)">
    <!-- Cadre structurel, ouvert à gauche et à droite au passage du flux -->
    <path class="s ink" stroke-linejoin="miter"
          d="M3.5,42 V3.5 H76.5 V42 M76.5,66 V76.5 H3.5 V66"/>
    <!-- Flux continu : entre, dessert, ressort -->
    <path class="s cu" stroke-linecap="round" stroke-linejoin="round"
          d="M-3,54 H26 V26 H54 V54 H83"/>
  </g>

  <!-- Wordmark FT2E — lettrage bâton monolinéaire (tracé, sans dépendance de fonte) -->
  <g transform="translate(104,16)">
    <!-- Wordmark FT2E — aplats vectoriels (polygones pleins), alignements exacts -->
    <path fill="#EDF1F5" d="M0,0 H24 V7 H7 V17.5 H19 V24.5 H7 V40 H0 Z"/>
    <path fill="#EDF1F5" transform="translate(35,0)" d="M0,0 H26 V7 H16.5 V40 H9.5 V7 H0 Z"/>
    <g transform="translate(72,0)" fill="none" stroke="#D98A55" stroke-width="7">
      <!-- Le 2 : arche circulaire pleine (R ext. 12 -> sommet y=0, flancs x=0/24), balayage courbe, barre de pied -->
      <path d="M3.5,12 A8.5,8.5 0 0 1 20.5,12 C20.5,19 17,27.5 3,36.5"/>
      <path d="M0,36.5 H24"/>
    </g>
    <path fill="#EDF1F5" transform="translate(107,0)" d="M0,0 H24 V7 H7 V16.5 H18 V23.5 H7 V33 H24 V40 H0 Z"/>
  </g>

  <text x="104" y="74" font-family="Arial, Helvetica, sans-serif" font-size="8.5"
        letter-spacing="2.6" fill="#9FB0BF">BUREAU D'ÉTUDES TECHNIQUES</text>
</svg>
